// --- フォルダ管理画面の状態管理 ---
let folderManageWorkingOrder = [];  // 並べ替え操作中の順序（"type:id" の配列）
let folderManageDirty = false;       // 並べ替え操作で順序が変わったか
let folderDragState = null;          // ドラッグ中の状態

// --- フォルダ管理画面の初期化 ---
function initFolderManage() {
  folderManageWorkingOrder = [];
  folderManageDirty = false;
  folderDragState = null;
  renderFolderManageList();
}

// --- フォルダ管理画面の描画（ブランド・タグ混在表示） ---
async function renderFolderManageList() {
  await loadAllData();
  const container = document.getElementById('folderManageList');

  // トップ画面の現在の並び順をそのまま反映する
  //   - トップ画面に表示されるフォルダ（全ブランド＋中身1件以上のタグ）→ トップ画面と同じ順序
  //   - トップ画面に表示されない中身0件のタグ → 末尾に名前順で追加

  // トップ画面に表示されるフォルダを構築
  let visibleFolders = [];
  allBrands.forEach(b => {
    visibleFolders.push({
      type: 'brand',
      id: b.id,
      name: b.name,
      count: allProducts.filter(p => p.brandId === b.id).length
    });
  });
  allTags.forEach(t => {
    const count = allProducts.filter(p => Array.isArray(p.tagIds) && p.tagIds.includes(t.id)).length;
    if (count > 0) {
      visibleFolders.push({ type: 'tag', id: t.id, name: t.name, count });
    }
  });

  // トップ画面と同じソートロジックを適用（renderBrands と揃える）
  if (currentSort === 'custom') {
    const orderMap = new Map(folderOrder.map((f, i) => [`${f.type}:${f.id}`, i]));
    visibleFolders.sort((a, b) => {
      const ka = `${a.type}:${a.id}`;
      const kb = `${b.type}:${b.id}`;
      const ai = orderMap.has(ka) ? orderMap.get(ka) : Infinity;
      const bi = orderMap.has(kb) ? orderMap.get(kb) : Infinity;
      if (ai === Infinity && bi === Infinity) {
        return a.name.localeCompare(b.name, 'ja');
      }
      return ai - bi;
    });
  } else if (currentSort === 'name_asc') {
    // === トップ画面と同じ並び順：タグを先頭にまとめ、ブランドはグループ順で並べる ===
    const tagFolders = visibleFolders.filter(f => f.type === 'tag');
    const brandFolders = visibleFolders.filter(f => f.type === 'brand');

    // タグは名前順
    tagFolders.sort((a, b) => a.name.localeCompare(b.name, 'ja'));

    // ブランドをグループ（A-Z／あ／か…）に分けて、各グループ内をソートキーで並べる
    const grouped = {};
    brandFolders.forEach(f => {
      const key = getBrandGroupKey(f.name);
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(f);
    });
    Object.values(grouped).forEach(arr => {
      arr.sort((a, b) => {
        const ka = getBrandSortKey(a.name);
        const kb = getBrandSortKey(b.name);
        return ka < kb ? -1 : ka > kb ? 1 : 0;
      });
    });

    // グループ順に詰め直す（renderBrands の GROUP_ORDER と揃える）
    const GROUP_ORDER = ['A-Z', 'あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ', 'その他'];
    const sortedBrands = [];
    GROUP_ORDER.forEach(groupKey => {
      const arr = grouped[groupKey];
      if (arr && arr.length > 0) sortedBrands.push(...arr);
    });

    visibleFolders = tagFolders.concat(sortedBrands);
  } else {
    // 価格・日付などは、フォルダ内の商品から代表値を計算
    const [field, order] = currentSort.split('_');
    const dir = order === 'asc' ? 1 : -1;
    const folderValue = (folder) => {
      let prods;
      if (folder.type === 'brand') {
        prods = allProducts.filter(p => p.brandId === folder.id);
      } else {
        prods = allProducts.filter(p => Array.isArray(p.tagIds) && p.tagIds.includes(folder.id));
      }
      if (prods.length === 0) return field === 'price' ? 0 : '';
      if (field === 'price') {
        return Math.max(...prods.map(p => Number(p.price) || 0));
      }
      const vals = prods.map(p => p[field] || '').filter(Boolean);
      if (vals.length === 0) return '';
      vals.sort();
      return vals[vals.length - 1];
    };
    visibleFolders.sort((a, b) => {
      const va = folderValue(a);
      const vb = folderValue(b);
      if (field === 'price') return (va - vb) * dir;
      return String(va).localeCompare(String(vb), 'ja') * dir;
    });
  }

  // 中身0件のタグを末尾に名前順で追加（管理画面でしか表示されない）
  const hiddenTags = allTags
    .filter(t => !allProducts.some(p => Array.isArray(p.tagIds) && p.tagIds.includes(t.id)))
    .map(t => ({ type: 'tag', id: t.id, name: t.name, count: 0 }))
    .sort((a, b) => a.name.localeCompare(b.name, 'ja'));

  let folders = visibleFolders.concat(hiddenTags);

  // 並べ替え操作中なら、その順序を尊重して並べ直す
  if (folderManageWorkingOrder.length > 0) {
    const workingMap = new Map(folderManageWorkingOrder.map((k, i) => [k, i]));
    folders.sort((a, b) => {
      const ka = `${a.type}:${a.id}`;
      const kb = `${b.type}:${b.id}`;
      const ai = workingMap.has(ka) ? workingMap.get(ka) : Infinity;
      const bi = workingMap.has(kb) ? workingMap.get(kb) : Infinity;
      return ai - bi;
    });
  }

  // 0件の場合
  if (folders.length === 0) {
    container.innerHTML = '<div style="font-size:13px;color:var(--text-lighter);padding:12px 0;text-align:center;">フォルダが登録されていません</div>';
    return;
  }

  // HTMLを生成
  let html = '';
  for (const f of folders) {
    const displayName = f.type === 'tag' ? '#' + esc(f.name) : esc(f.name);
    const editAction = f.type === 'tag'
      ? `showEditTagModal('${f.id}')`
      : `showEditBrandModal('${f.id}')`;
    const deleteAction = f.type === 'tag'
      ? `showDeleteTagModal('${f.id}')`
      : `showDeleteBrandModalFromManage('${f.id}')`;

    html += `<div class="folder-card" data-key="${f.type}:${f.id}">
      <div class="folder-card-handle"
           ontouchstart="onFolderHandleTouchStart(event)"
           ontouchmove="onFolderHandleTouchMove(event)"
           ontouchend="onFolderHandleTouchEnd(event)"
           ontouchcancel="onFolderHandleTouchEnd(event)">
        <svg viewBox="0 0 24 24">
          <line x1="4" y1="8" x2="20" y2="8"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="16" x2="20" y2="16"/>
        </svg>
      </div>
      <div class="folder-card-name">${displayName}</div>
      <div class="folder-card-count">${f.count}件</div>
      <button class="folder-card-btn" onclick="${editAction}" title="編集">
        <svg viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
      </button>
      <button class="folder-card-btn delete" onclick="${deleteAction}" title="削除">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
      </button>
    </div>`;
  }
  container.innerHTML = html;
}

// --- フォルダ管理画面の再描画ヘルパー ---
function refreshManageScreen() {
  if (currentScreen === 'folderManage') {
    renderFolderManageList();
  }
}

// --- ドラッグハンドル：押下開始 ---
function onFolderHandleTouchStart(e) {
  if (folderDragState) return;
  e.preventDefault();
  e.stopPropagation();

  const handle = e.currentTarget;
  const card = handle.closest('.folder-card');
  if (!card) return;

  const rect = card.getBoundingClientRect();
  const touch = e.touches[0];

  // 元の位置を保持するplaceholder
  const placeholder = document.createElement('div');
  placeholder.className = 'folder-placeholder';
  placeholder.style.height = rect.height + 'px';
  card.parentNode.insertBefore(placeholder, card);

  // カードをfixed化して浮かせる
  card.classList.add('dragging');
  card.style.position = 'fixed';
  card.style.left = rect.left + 'px';
  card.style.top = rect.top + 'px';
  card.style.width = rect.width + 'px';
  card.style.zIndex = '1000';

  folderDragState = {
    card,
    placeholder,
    offsetY: touch.clientY - rect.top
  };
}

// --- ドラッグハンドル：移動中 ---
function onFolderHandleTouchMove(e) {
  if (!folderDragState) return;
  e.preventDefault();

  const touch = e.touches[0];
  const newTop = touch.clientY - folderDragState.offsetY;
  folderDragState.card.style.top = newTop + 'px';

  // 他のカードの位置から、placeholderの挿入先を決定
  const list = document.getElementById('folderManageList');
  const children = Array.from(list.children).filter(c =>
    c !== folderDragState.card && c !== folderDragState.placeholder
  );

  const centerY = touch.clientY;
  let inserted = false;
  for (const c of children) {
    const rect = c.getBoundingClientRect();
    const midpoint = (rect.top + rect.bottom) / 2;
    if (centerY < midpoint) {
      list.insertBefore(folderDragState.placeholder, c);
      inserted = true;
      break;
    }
  }
  if (!inserted) {
    list.appendChild(folderDragState.placeholder);
  }
}

// --- ドラッグハンドル：終了 ---
function onFolderHandleTouchEnd(e) {
  if (!folderDragState) return;

  const list = document.getElementById('folderManageList');
  const { card, placeholder } = folderDragState;

  // placeholderの位置にcardを戻す
  list.insertBefore(card, placeholder);
  placeholder.remove();

  // styleをリセット
  card.classList.remove('dragging');
  card.style.position = '';
  card.style.left = '';
  card.style.top = '';
  card.style.width = '';
  card.style.zIndex = '';

  // 並べ替え結果を保持
  const newOrder = Array.from(list.querySelectorAll('.folder-card'))
    .map(el => el.dataset.key);

  // 順序が変わったかチェック
  const previousOrder = folderManageWorkingOrder.length > 0
    ? folderManageWorkingOrder
    : getCurrentFolderOrderKeys();
  const changed = newOrder.some((k, i) => k !== previousOrder[i]);

  folderManageWorkingOrder = newOrder;
  if (changed) {
    folderManageDirty = true;
    updateFolderManageHeaderButtons();
  }

  folderDragState = null;
}

// --- 描画前の現在の表示順を "type:id" 配列で取得 ---
function getCurrentFolderOrderKeys() {
  const list = document.getElementById('folderManageList');
  return Array.from(list.querySelectorAll('.folder-card'))
    .map(el => el.dataset.key);
}

// --- ヘッダーのキャンセル・確定ボタンの表示を切り替え ---
function updateFolderManageHeaderButtons() {
  const cancelBtn = document.getElementById('btnFolderManageCancel');
  const confirmBtn = document.getElementById('btnFolderManageConfirm');
  if (folderManageDirty) {
    cancelBtn.style.display = 'inline-block';
    confirmBtn.style.display = 'inline-block';
  } else {
    cancelBtn.style.display = 'none';
    confirmBtn.style.display = 'none';
  }
}

// --- 並べ替えを保存（DBへ反映） ---
async function saveFolderManageOrder() {
  if (!folderManageDirty || folderManageWorkingOrder.length === 0) return;

  const newOrder = folderManageWorkingOrder.map(key => {
    const [type, id] = key.split(':');
    return { type, id };
  });
  await dbPut('meta', { key: 'folderOrder', value: newOrder });
  folderOrder = newOrder;
  // トップ画面で「並べ替え順」が選ばれているかどうかに関わらず、
  // ユーザーが新しい順序を指定したので custom に切り替える
  currentSort = 'custom';
  // 次回起動時に復元できるようDBに保存
  await dbPut('meta', { key: 'topSort', value: 'custom' });
  await markDataUpdated();
}

// --- 確定ボタン：保存して来た画面へ戻る ---
async function confirmFolderManageReorder() {
  await saveFolderManageOrder();
  folderManageWorkingOrder = [];
  folderManageDirty = false;
  toast('並び順を保存しました');
  goBack();
}

// --- キャンセルボタン：破棄して来た画面へ戻る ---
function cancelFolderManageReorder() {
  folderManageWorkingOrder = [];
  folderManageDirty = false;
  // dirty フラグをクリアした状態で goBack を呼ぶことで、
  // leaveFolderManageScreen() で保存処理が走らずに離脱できる
  goBack();
}

// --- 〈ボタン／スマホ戻る用：未確定の並べ替えを保存しつつ画面を離れる ---
async function leaveFolderManageScreen() {
  if (folderManageDirty) {
    await saveFolderManageOrder();
    toast('並び順を保存しました');
  }
  folderManageWorkingOrder = [];
  folderManageDirty = false;
}

  showModal({

    ]
  });

    const input = document.getElementById('brandEditInput');
    if (input) { input.focus(); input.select(); }
  }, 100);
}

// --- ブランド名更新の実行 ---
async function updateBrandName(brandId) {
  const input = document.getElementById('brandEditInput');
  const newName = input?.value.trim();
  if (!newName) {
    toast('ブランド名を入力してください');
    return;
  }
  const brand = allBrands.find(b => b.id === brandId);
  if (!brand) return;
  if (allBrands.some(b => b.id !== brandId && b.name === newName)) {
    toast('同じ名前のブランドが既にあります');
    return;
  }
  brand.name = newName;
  await dbPut('brands', brand);
  await markDataUpdated();
  closeModal();
  toast('ブランド名を更新しました');
  refreshManageScreen();
}

// --- ブランド削除モーダル（フォルダ管理画面用） ---
function showDeleteBrandModalFromManage(brandId) {
  const brand = allBrands.find(b => b.id === brandId);
  if (!brand) return;
  const count = allProducts.filter(p => p.brandId === brandId).length;
  let msg = `「${esc(brand.name)}」を削除しますか？`;
  if (count > 0) {
    msg += `<br><br><span style="color:var(--accent);font-size:13px;">このブランドに含まれる ${count} 件の商品は「未分類」になります（商品自体は削除されません）。</span>`;
  }
  showModal({
    title: 'ブランドを削除',
    content: msg,
    actions: [
      { text: 'キャンセル', cls: 'modal-cancel', action: closeModal },
      { text: '削除する', cls: 'modal-danger', action: () => deleteBrandFromManage(brandId) }
    ]
  });
}

// --- ブランド削除の実行（フォルダ管理画面用） ---
//   商品は削除せず、brandId をクリアして「未分類」状態にする
async function deleteBrandFromManage(brandId) {
  // ブランド配下の商品の brandId をクリア
  const products = allProducts.filter(p => p.brandId === brandId);
  for (const p of products) {
    p.brandId = null;
    await dbPut('products', p);
  }
  // ブランド本体を削除
  await dbDelete('brands', brandId);
  // folderOrder からも削除（ゴミデータが残らないように）
  if (Array.isArray(folderOrder)) {
    folderOrder = folderOrder.filter(f => !(f.type === 'brand' && f.id === brandId));
    await dbPut('meta', { key: 'folderOrder', value: folderOrder });
  }
  await markDataUpdated();
  closeModal();
  toast('ブランドを削除しました');
  refreshManageScreen();
}

  const tag = allTags.find(t => t.id === tagId);
  if (!tag) return;
  const count = allProducts.filter(p => (p.tagIds || []).includes(tagId)).length;
  let msg = `「${esc(tag.name)}」を削除しますか？`;
  if (count > 0) {
    msg += `<br><br><span style="color:var(--accent);font-size:13px;">この操作により、このタグを使用中の ${count} 件のカードからタグが外れます。</span>`;
  }
  showModal({
    title: 'タグを削除',
    content: msg,
    actions: [
      { text: 'キャンセル', cls: 'modal-cancel', action: closeModal },
      { text: '削除する', cls: 'modal-danger', action: () => deleteTag(tagId) }
    ]
  });

// --- タグ削除の実行 ---
async function deleteTag(tagId) {
  await loadAllData();
  // 該当タグを商品から外す
  for (const p of allProducts) {
    if (p.tagIds && p.tagIds.includes(tagId)) {
      p.tagIds = p.tagIds.filter(id => id !== tagId);
      await dbPut('products', p);
    }
  }
  // タグ本体を削除
  await dbDelete('tags', tagId);
  // folderOrder からも削除（ゴミデータが残らないように）
  if (Array.isArray(folderOrder)) {
    folderOrder = folderOrder.filter(f => !(f.type === 'tag' && f.id === tagId));
    await dbPut('meta', { key: 'folderOrder', value: folderOrder });
  }
  await markDataUpdated();
  closeModal();
  toast('タグを削除しました');
  refreshManageScreen();
}

/* ══════════════════════════════════════════
   #LIGHTBOX_JS 画像全画面モーダル制御
   ══════════════════════════════════════════ */

// --- ライトボックスの状態 ---
let lightboxImages = [];
let lightboxIndex = 0;
let lightboxClosing = false;

// --- スワイプ検出用 ---
let lbTouchStartX = 0;
let lbTouchStartY = 0;
let lbTouchStartTime = 0;
let lbTouchFingers = 0;

// --- ライトボックスを開く（詳細画面の画像タップ時） ---
// startIndex: 開始画像のインデックス（省略時は0）
async function openLightbox(startIndex = 0) {
  const p = await dbGet('products', currentProductId);
  if (!p?.images?.length) return;
  lightboxImages = [...p.images];
  // 範囲外なら0にフォールバック
  lightboxIndex = (Number.isInteger(startIndex) && startIndex >= 0 && startIndex < lightboxImages.length)
    ? startIndex
    : 0;
  showLightbox();
  history.pushState({ screen: currentScreen, lightbox: true }, '');
}

// --- ライトボックスの表示を更新 ---
function showLightbox() {
  const overlay = document.getElementById('lightbox');
  const wrap = document.getElementById('lightboxImageWrap');
  const dots = document.getElementById('lightboxDots');

  const blob = lightboxImages[lightboxIndex];
  const url = (typeof blob === 'string') ? blob : URL.createObjectURL(blob);
  wrap.innerHTML = `<img src="${url}" alt="" onload="${typeof blob !== 'string' ? 'URL.revokeObjectURL(this.src)' : ''}">`;

  if (lightboxImages.length > 1) {
    dots.innerHTML = lightboxImages.map((_, i) =>
      `<span class="lightbox-dot${i === lightboxIndex ? ' active' : ''}"></span>`
    ).join('');
    dots.style.display = 'flex';
  } else {
    dots.style.display = 'none';
  }

  overlay.classList.add('show');
}

// --- ライトボックスを閉じる（×ボタン用） ---
function closeLightbox() {
  if (!document.getElementById('lightbox').classList.contains('show')) return;
  document.getElementById('lightbox').classList.remove('show');
  lightboxImages = [];
  lightboxIndex = 0;
  lightboxClosing = true;
  history.back();
}

// --- ライトボックス内のスワイプ開始 ---
function onLightboxTouchStart(e) {
  lbTouchFingers = e.touches.length;
  if (lbTouchFingers >= 2) return;
  lbTouchStartX = e.touches[0].clientX;
  lbTouchStartY = e.touches[0].clientY;
  lbTouchStartTime = Date.now();
}

// --- ライトボックス内のタッチ移動（2本指はスルー） ---
function onLightboxTouchMove(e) {
  if (e.touches.length === 1 && lightboxImages.length > 1) {
    const dx = Math.abs(e.touches[0].clientX - lbTouchStartX);
    const dy = Math.abs(e.touches[0].clientY - lbTouchStartY);
    if (dx > dy && dx > 10) {
      e.preventDefault();
    }
  }
}
document.getElementById('lightbox').addEventListener('touchmove', onLightboxTouchMove, { passive: false });

// --- ライトボックス内のスワイプ終了（ループ対応） ---
function onLightboxTouchEnd(e) {
  if (lbTouchFingers >= 2) return;
  if (lightboxImages.length <= 1) return;

  const dx = e.changedTouches[0].clientX - lbTouchStartX;
  const dy = e.changedTouches[0].clientY - lbTouchStartY;
  const dt = Date.now() - lbTouchStartTime;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);

  if (absDx > 60 && absDx > absDy * 2 && dt < 400) {
    const len = lightboxImages.length;
    if (dx < 0) {
      lightboxIndex = (lightboxIndex + 1) % len;
      showLightbox();
    } else if (dx > 0) {
      lightboxIndex = (lightboxIndex - 1 + len) % len;
      showLightbox();
    }
  }
}


/* ══════════════════════════════════════════
   #TOAST_JS トースト制御
   ══════════════════════════════════════════ */

let toastTimer = null;

// --- トースト通知を表示（2秒後に自動で消える） ---
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}


/* ══════════════════════════════════════════
   #UTIL ユーティリティ関数
   ══════════════════════════════════════════ */

// --- HTMLエスケープ（XSS対策） ---
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// --- HTMLエスケープ＋検索ハイライト（複数単語対応） ---
function escHL(s, query) {
  if (!s) return '';
  const escaped = esc(s);
  const queries = splitQuery(query);
  if (queries.length === 0) return escaped;

  // 全単語を正規表現用にエスケープしてOR連結
  const escapedQueries = queries
    .map(q => esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
    .filter(Boolean);
  if (escapedQueries.length === 0) return escaped;

  const pattern = `(${escapedQueries.join('|')})`;
  return escaped.replace(new RegExp(pattern, 'gi'), '<mark class="hl">$1</mark>');
}


/* ══════════════════════════════════════════
   #INIT 初期化
   ══════════════════════════════════════════ */

// --- 既存商品のimage→images配列移行（一度だけ実行） ---
async function migrateProductImages() {
  const migrated = await dbGet('meta', 'migratedToImagesArray');
  if (migrated) return;

  const products = await dbGetAll('products');
  for (const p of products) {
    if (p.images === undefined) {
      p.images = p.image ? [p.image] : [];
      await dbPut('products', p);
    }
  }
  await dbPut('meta', { key: 'migratedToImagesArray', value: true });
}

// --- アプリ非表示・終了時にフォーム内容を自動保存 ---
async function onAppHiding() {
  if (formSubmitted) return;
  if (currentScreen === 'form') {
    await autoSaveProduct();
  } else if (currentScreen === 'memoForm') {
    await autoSaveMemo();
  }
}

// --- アプリ起動時の処理 ---
(async function init() {
  await openDB();
  await migrateProductCategories();
  await migrateProductImages();
  await loadCategories();

  // 前回保存したトップ画面のソート状態を復元
  const savedSort = await dbGet('meta', 'topSort');
  if (savedSort?.value) {
    currentSort = savedSort.value;
  }

  // --- キーボード表示時のビューポート調整 ---
  // interactive-widget=resizes-content により、キーボード表示時に
  // レイアウトビューポート自体がリサイズされる。
  // 以下は補助的なフォールバックとフォーカス管理。
  if (window.visualViewport) {
    const mainArea = document.getElementById('mainArea');
    const initHeight = window.visualViewport.height; // 起動時の高さを記録
    let kbOpen = false;

    const updateVH = () => {
      // ピンチズーム中は--app-hを更新しない（空白防止）
      if (window.visualViewport.scale > 1.01) return;

      const h = window.visualViewport.height;
      document.documentElement.style.setProperty('--app-h', h + 'px');

      // キーボード表示判定（起動時の75%未満なら表示中）
      const isKB = h < initHeight * 0.75;
      if (isKB !== kbOpen) {
        kbOpen = isKB;
        document.body.classList.toggle('keyboard-open', isKB);
      }

      // 念のためスクロール位置リセット
      window.scrollTo(0, 0);
    };

    window.visualViewport.addEventListener('resize', updateVH);
    window.visualViewport.addEventListener('scroll', () => {
      window.scrollTo(0, 0);
    });
    updateVH();

    // フォーム入力欄フォーカス時：mainArea内でスクロールして見せる
    mainArea.addEventListener('focusin', (e) => {
      const el = e.target;
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') {
        setTimeout(() => {
          window.scrollTo(0, 0);
          el.scrollIntoView({ block: 'center', behavior: 'smooth' });
          setTimeout(() => window.scrollTo(0, 0), 200);
        }, 300);
      }
    });
  }

  // --- アプリ非表示・終了時の自動保存リスナー ---
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      onAppHiding();
    }
  });
  window.addEventListener('pagehide', () => {
    onAppHiding();
  });

  // 初期状態をブラウザ履歴に設定
  history.replaceState({ screen: 'brand' }, '');
  showScreen('brand', false);
})();

</script>

<script>
// PWA インストールボタン制御
let deferredPrompt = null;
const btnInstall = document.getElementById('btnInstall');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstall.style.display = '';
});

btnInstall.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const result = await deferredPrompt.userChoice;
  deferredPrompt = null;
  btnInstall.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
  btnInstall.style.display = 'none';
  deferredPrompt = null;
});
</script>

<script>
// Service Worker 登録＆更新通知
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    // アプリが画面に戻った時にも更新チェックする
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        reg.update();
      }
    });

    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      // 既にcontrollerがある場合のみ通知（初回インストールでは出さない）
      if (!navigator.serviceWorker.controller) return;

      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'activated') {
          if (confirm('新しいバージョンがあります。更新しますか？')) {
            location.reload();
          }
        }
      });
    });
  });
}
</script>
