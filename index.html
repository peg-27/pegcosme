// --- 並べ替えモードに入る ---
async function enterSortMode() {
  if (currentScreen !== 'products' && currentScreen !== 'tagProducts' && currentScreen !== 'brand') return;
  if (isSortMode) return;

  await loadAllData();

  // 画面に応じて初期順序を構築
  if (currentScreen === 'brand') {
    // トップ画面：ブランド＋タグ混在のフォルダ並べ替え
    // 中身が1件以上あるタグだけを対象にする（現状の表示と揃える）
    const visibleTags = allTags.filter(t =>
      allProducts.some(p => Array.isArray(p.tagIds) && p.tagIds.includes(t.id))
    );

    // フォルダ配列を構築
    let folders = [];
    allBrands.forEach(b => {
      folders.push({ type: 'brand', id: b.id, name: b.name });
    });
    visibleTags.forEach(t => {
      folders.push({ type: 'tag', id: t.id, name: t.name });
    });

    // --- 現在のトップ画面のソート結果に揃える ---
    if (currentSort === 'custom') {
      // 「並べ替え順」適用中：保存済み folderOrder を使う
      const orderMap = new Map(folderOrder.map((f, i) => [`${f.type}:${f.id}`, i]));
      folders.sort((a, b) => {
        const ka = `${a.type}:${a.id}`;
        const kb = `${b.type}:${b.id}`;
        const ai = orderMap.has(ka) ? orderMap.get(ka) : Infinity;
        const bi = orderMap.has(kb) ? orderMap.get(kb) : Infinity;
        if (ai === Infinity && bi === Infinity) {
          return a.name.localeCompare(b.name, 'ja');
        }
        return ai - bi;
      });
    } else if (currentSort === 'name_asc') {
      folders.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    } else {
      // 価格・日付などは、フォルダ内の商品から代表値を計算
      const [field, order] = currentSort.split('_');
      const dir = order === 'asc' ? 1 : -1;

      const folderValue = (folder) => {
        let prods;
        if (folder.type === 'brand') {
          prods = allProducts.filter(p => p.brandId === folder.id);
        } else {
          prods = allProducts.filter(p => Array.isArray(p.tagIds) && p.tagIds.includes(folder.id));
        }
        if (prods.length === 0) return field === 'price' ? 0 : '';
        if (field === 'price') {
          return Math.max(...prods.map(p => Number(p.price) || 0));
        }
        const vals = prods.map(p => p[field] || '').filter(Boolean);
        if (vals.length === 0) return '';
        vals.sort();
        return vals[vals.length - 1];
      };

      folders.sort((a, b) => {
        const va = folderValue(a);
        const vb = folderValue(b);
        if (field === 'price') return (va - vb) * dir;
        return String(va).localeCompare(String(vb), 'ja') * dir;
      });
    }

    // sortModeWorkingOrder には "type:id" 形式の文字列を入れる
    sortModeWorkingOrder = folders.map(f => `${f.type}:${f.id}`);
    isSortMode = true;
    updateHeaderForSortMode();
    renderSortModeList();
    return;
  }

  // 画面に応じて対象商品と保存済み順序を取得（既存処理）
  let products, savedOrder;
  if (currentScreen === 'tagProducts') {
    products = allProducts.filter(p =>
      Array.isArray(p.tagIds) && p.tagIds.includes(currentTagId)
    );
    const tag = allTags.find(t => t.id === currentTagId);
    savedOrder = tag?.cardOrder;
  } else {
    products = allProducts.filter(p => p.brandId === currentBrandId);
    const brand = allBrands.find(b => b.id === currentBrandId);
    savedOrder = brand?.sortOrder;
  }

  // 初期順序を構築：保存済み順序があればそれを、なければ登録日新しい順
  let ordered;
  if (savedOrder && savedOrder.length > 0) {
    const orderMap = new Map(savedOrder.map((id, i) => [id, i]));
    ordered = products.slice().sort((a, b) => {
      const ai = orderMap.has(a.id) ? orderMap.get(a.id) : Infinity;
      const bi = orderMap.has(b.id) ? orderMap.get(b.id) : Infinity;
      if (ai === Infinity && bi === Infinity) {
        return (b.createdAt || '').localeCompare(a.createdAt || '', 'ja');
      }
      return ai - bi;
    });
  } else {
    ordered = products.slice().sort((a, b) =>
      (b.createdAt || '').localeCompare(a.createdAt || '', 'ja')
    );
  }

  sortModeWorkingOrder = ordered.map(p => p.id);
  isSortMode = true;
  updateHeaderForSortMode();
  renderSortModeList();
}

// --- 並べ替えモード用の平べったい一覧を描画 ---
function renderSortModeList() {
  // 画面によって対象リストの DOM が違う
  let list, empty;
  if (currentScreen === 'brand') {
    list = document.getElementById('brandList');
    empty = document.getElementById('brandEmpty');
  } else {
    list = document.getElementById('productList');
    empty = document.getElementById('productEmpty');
  }
  empty.style.display = 'none';

  // 並べ替えモード中は強制的にリスト表示にする（グリッド時のはみ出し対策）
  // currentViewMode 変数は触らない。解除時の renderProducts/renderTagProducts 側で
  // applyViewMode() が呼ばれて自動的に元のモードに戻る。
  list.classList.remove('grid-view');

  // トップ画面（フォルダ並べ替え）
  if (currentScreen === 'brand') {
    const brandMap = new Map(allBrands.map(b => [b.id, b]));
    const tagMap = new Map(allTags.map(t => [t.id, t]));

    const html = sortModeWorkingOrder.map(key => {
      const [type, id] = key.split(':');
      let name = '';
      if (type === 'brand') {
        const b = brandMap.get(id);
        if (!b) return '';
        name = b.name;
      } else {
        const t = tagMap.get(id);
        if (!t) return '';
        name = '#' + t.name;
      }
      return `<div class="sort-card" data-id="${esc(key)}">
        <div class="sort-card-name">${esc(name)}</div>
        <div class="sort-card-handle"
             ontouchstart="onHandleTouchStart(event)"
             ontouchmove="onHandleTouchMove(event)"
             ontouchend="onHandleTouchEnd(event)"
             ontouchcancel="onHandleTouchEnd(event)">
          <svg viewBox="0 0 24 24">
            <line x1="4" y1="8" x2="20" y2="8"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="16" x2="20" y2="16"/>
          </svg>
        </div>
      </div>`;
    }).join('');

    list.innerHTML = html;
    return;
  }

  // ブランドフォルダ／タグフォルダ画面（既存処理）
  let targetProducts;
  if (currentScreen === 'tagProducts') {
    targetProducts = allProducts.filter(p =>
      Array.isArray(p.tagIds) && p.tagIds.includes(currentTagId)
    );
  } else {
    targetProducts = allProducts.filter(p => p.brandId === currentBrandId);
  }
  const productMap = new Map(targetProducts.map(p => [p.id, p]));

  const html = sortModeWorkingOrder.map(id => {
    const p = productMap.get(id);
    if (!p) return '';
    return `<div class="sort-card" data-id="${p.id}">
      <div class="sort-card-name">${esc(p.name)}</div>
      <div class="sort-card-handle"
           ontouchstart="onHandleTouchStart(event)"
           ontouchmove="onHandleTouchMove(event)"
           ontouchend="onHandleTouchEnd(event)"
           ontouchcancel="onHandleTouchEnd(event)">
        <svg viewBox="0 0 24 24">
          <line x1="4" y1="8" x2="20" y2="8"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="16" x2="20" y2="16"/>
        </svg>
      </div>
    </div>`;
  }).join('');

  list.innerHTML = html;
}

// --- 並べ替えモード時のヘッダー切替 ---
function updateHeaderForSortMode() {
  const backBtn = document.getElementById('btnBack');
  const tabBar = document.getElementById('tabBar');
  const searchBar = document.getElementById('searchBar');
  const fab = document.getElementById('fab');
  const settingsBtn = document.getElementById('btnSettings');
  const sortBtn = document.getElementById('btnSort');
  const filterBtn = document.getElementById('btnFilter');
  const searchBtn = document.getElementById('btnSearch');
  const viewModeBtn = document.getElementById('btnViewMode');
  const title = document.getElementById('headerTitle');
  const confirmBtn = document.getElementById('btnSortConfirm');
  const cancelBtn = document.getElementById('btnSortCancel');

  if (isSortMode) {
    backBtn.style.display = 'none';
    tabBar.style.display = 'none';
    searchBar.style.display = 'none';
    fab.style.display = 'none';
    settingsBtn.style.display = 'none';
    sortBtn.style.display = 'none';
    filterBtn.style.display = 'none';
    searchBtn.style.display = 'none';
    viewModeBtn.style.display = 'none';
    confirmBtn.style.display = 'inline-block';
    cancelBtn.style.display = 'inline-block';
    title.textContent = '並べ替え';
  } else {
    // 並べ替えモード解除：インラインスタイルをクリアして、
    // CSSルールや各要素本来の表示制御ロジックに表示判断を委ねる
    backBtn.style.display = '';
    searchBar.style.display = '';
    fab.style.display = '';
    settingsBtn.style.display = '';
    sortBtn.style.display = '';
    filterBtn.style.display = '';
    // 検索ボタンは全画面で表示するので空文字でクリア
    searchBtn.style.display = '';
    // 表示切替ボタンは画面別に分岐
    // ・products / tagProducts：表示
    // ・brand（トップ画面）：非表示
    if (currentScreen === 'products' || currentScreen === 'tagProducts') {
      viewModeBtn.style.display = '';
    } else {
      viewModeBtn.style.display = 'none';
    }
    // 並べ替え専用ボタンは HTML側でインラインに display:none が書かれている。
    // 空文字でクリアするとCSSルールに該当指定がなく表示されてしまうため、
    // 明示的に 'none' を指定して非表示に戻す。
    confirmBtn.style.display = 'none';
    cancelBtn.style.display = 'none';
    // タブバーはフォルダ画面（products／tagProducts）では非表示のまま、それ以外で表示
    if (currentScreen === 'products' || currentScreen === 'tagProducts') {
      tabBar.style.display = 'none';
    } else {
      tabBar.style.display = '';
    }
    // タイトル復帰：画面に応じて分岐（直後のrender関数で件数付きに上書きされるが暫定値）
    if (currentScreen === 'tagProducts') {
      title.textContent = '#' + getTagName(currentTagId);
    } else if (currentScreen === 'products') {
      title.textContent = getBrandName(currentBrandId);
    } else {
      // トップ画面（brand）：タイトルは空（ロゴ表示のため）
      title.textContent = '';
    }
  }
}

// --- 並べ替えを確定（DB保存） ---
async function confirmSortMode() {
  if (currentScreen === 'brand') {
    // フォルダ並べ替え：folderOrder を meta ストアに保存
    const newOrder = sortModeWorkingOrder.map(key => {
      const [type, id] = key.split(':');
      return { type, id };
    });
    await dbPut('meta', { key: 'folderOrder', value: newOrder });
    folderOrder = newOrder;
    await markDataUpdated();

    isSortMode = false;
    sortModeWorkingOrder = [];
    currentSort = 'custom';
    // 次回起動時に復元できるようDBに保存
    await dbPut('meta', { key: 'topSort', value: 'custom' });
    updateHeaderForSortMode();
    renderBrands();
    toast('並び順を保存しました');
    return;
  }

  if (currentScreen === 'tagProducts') {
    const tag = await dbGet('tags', currentTagId);
    if (tag) {
      tag.cardOrder = [...sortModeWorkingOrder];
      await dbPut('tags', tag);
      await markDataUpdated();
    }
  } else {
    const brand = await dbGet('brands', currentBrandId);
    if (brand) {
      brand.sortOrder = [...sortModeWorkingOrder];
      await dbPut('brands', brand);
      await markDataUpdated();
    }
  }

  isSortMode = false;
  sortModeWorkingOrder = [];
  await loadAllData();
  // フォルダ内画面なので currentProductSort を更新（元コードは currentSort になっていた）
  currentProductSort = 'custom';
  // 次回起動時に復元できるようDBに保存
  await dbPut('meta', { key: 'productSort', value: 'custom' });
  updateHeaderForSortMode();
  if (currentScreen === 'tagProducts') {
    renderTagProducts();
  } else {
    renderProducts();
  }
  toast('並び順を保存しました');
}

// --- 並べ替えをキャンセル ---
function cancelSortMode() {
  isSortMode = false;
  sortModeWorkingOrder = [];
  updateHeaderForSortMode();
  if (currentScreen === 'brand') {
    renderBrands();
  } else if (currentScreen === 'tagProducts') {
    renderTagProducts();
  } else {
    renderProducts();
  }
}

// ══════════════════════════════════════════
// #DRAGDROP_JS ドラッグ&ドロップ（並べ替えモード用）
// ══════════════════════════════════════════

// --- ドラッグ用の状態 ---
let sortDragState = null;

// --- 並べ替えモード中、現在の画面に対応するリスト要素を返す ---
function getSortListEl() {
  if (currentScreen === 'brand') {
    return document.getElementById('brandList');
  }
  return document.getElementById('productList');
}

// --- ハンドル押下開始 ---
function onHandleTouchStart(e) {
  if (sortDragState) return;
  e.preventDefault();
  e.stopPropagation();

  const handle = e.currentTarget;
  const card = handle.closest('.sort-card');
  if (!card) return;

  const rect = card.getBoundingClientRect();
  const touch = e.touches[0];

  // 元の位置を保持するplaceholder
  const placeholder = document.createElement('div');
  placeholder.className = 'sort-placeholder';
  placeholder.style.height = rect.height + 'px';
  card.parentNode.insertBefore(placeholder, card);

  // カードをfixed化して浮かせる
  card.classList.add('dragging');
  card.style.position = 'fixed';
  card.style.left = rect.left + 'px';
  card.style.top = rect.top + 'px';
  card.style.width = rect.width + 'px';
  card.style.zIndex = '1000';

  sortDragState = {
    card,
    placeholder,
    offsetY: touch.clientY - rect.top
  };
}

// --- ドラッグ移動中 ---
function onHandleTouchMove(e) {
  if (!sortDragState) return;
  e.preventDefault();

  const touch = e.touches[0];
  const newTop = touch.clientY - sortDragState.offsetY;
  sortDragState.card.style.top = newTop + 'px';

  // 他のカードの位置から、placeholderの挿入先を決定
  const list = getSortListEl();
  const children = Array.from(list.children).filter(c =>
    c !== sortDragState.card && c !== sortDragState.placeholder
  );

  const centerY = touch.clientY;
  let inserted = false;
  for (const c of children) {
    const rect = c.getBoundingClientRect();
    const midpoint = (rect.top + rect.bottom) / 2;
    if (centerY < midpoint) {
      list.insertBefore(sortDragState.placeholder, c);
      inserted = true;
      break;
    }
  }
  if (!inserted) {
    list.appendChild(sortDragState.placeholder);
  }
}

// --- ドラッグ終了 ---
function onHandleTouchEnd(e) {
  if (!sortDragState) return;

  const list = getSortListEl();
  const { card, placeholder } = sortDragState;

  // placeholderの位置にcardを戻す
  list.insertBefore(card, placeholder);
  placeholder.remove();

  // styleをリセット
  card.classList.remove('dragging');
  card.style.position = '';
  card.style.left = '';
  card.style.top = '';
  card.style.width = '';
  card.style.zIndex = '';

  // sortModeWorkingOrderを更新
  sortModeWorkingOrder = Array.from(list.querySelectorAll('.sort-card'))
    .map(el => el.dataset.id);

  sortDragState = null;
}


/* ══════════════════════════════════════════
   #DETAIL_JS 商品詳細ロジック
   ══════════════════════════════════════════ */

// --- スワイプナビゲーション用の状態 ---
let detailNavList = [];
let detailNavIndex = -1;

// --- 現在表示中の画像インデックス（詳細画面内の画像送り用） ---
let currentImageIndex = 0;
let currentImageCount = 0;
let lastRenderedProductId = null;

// --- スワイプ検出用の変数 ---
let detailTouchStartX = 0;
let detailTouchStartY = 0;
let detailTouchStartTime = 0;

// --- 画像エリア用のスワイプ検出変数 ---
let imgTouchStartX = 0;
let imgTouchStartY = 0;
let imgTouchStartTime = 0;
let imgTouchActive = false;

// --- 詳細画面のタッチ開始 ---
function onDetailTouchStart(e) {
  detailTouchStartX = e.touches[0].clientX;
  detailTouchStartY = e.touches[0].clientY;
  detailTouchStartTime = Date.now();
}

// --- 詳細画面のタッチ終了（スワイプ判定） ---
function onDetailTouchEnd(e) {
  if (detailNavList.length <= 1) return;

  const dx = e.changedTouches[0].clientX - detailTouchStartX;
  const dy = e.changedTouches[0].clientY - detailTouchStartY;
  const dt = Date.now() - detailTouchStartTime;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);

  if (absDx > 80 && absDx > absDy * 2 && dt < 400) {
    if (dx < 0) {
      navigateDetail(1);
    } else {
      navigateDetail(-1);
    }
  }
}

// --- 画像エリアのタッチ開始（画像が複数ある時だけ独自処理） ---
function onDetailImageTouchStart(e) {
  if (currentImageCount <= 1) {
    imgTouchActive = false;
    return; // 画像1枚以下なら通常のカード切り替えに委ねる
  }
  imgTouchActive = true;
  imgTouchStartX = e.touches[0].clientX;
  imgTouchStartY = e.touches[0].clientY;
  imgTouchStartTime = Date.now();
  e.stopPropagation(); // 親のカード切り替えハンドラには渡さない
}

// --- 画像エリアのタッチ終了（画像切り替え判定） ---
function onDetailImageTouchEnd(e) {
  if (!imgTouchActive) return;
  e.stopPropagation();

  const dx = e.changedTouches[0].clientX - imgTouchStartX;
  const dy = e.changedTouches[0].clientY - imgTouchStartY;
  const dt = Date.now() - imgTouchStartTime;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);

  // 画像エリアは狭いので閾値は40pxに設定
  if (absDx > 40 && absDx > absDy * 2 && dt < 400) {
    if (dx < 0) {
      navigateDetailImage(1);
    } else {
      navigateDetailImage(-1);
    }
  }
}

// --- 前後のカードに移動 ---
function navigateDetail(direction) {
  const newIndex = detailNavIndex + direction;
  if (newIndex < 0 || newIndex >= detailNavList.length) return;

  detailNavIndex = newIndex;
  currentProductId = detailNavList[newIndex];
  currentImageIndex = 0; // 別商品に移ったら画像インデックスもリセット

  const screen = document.getElementById('screenDetail');
  const animClass = direction > 0 ? 'detail-slide-left' : 'detail-slide-right';
  screen.classList.add(animClass);
  screen.addEventListener('animationend', () => {
    screen.classList.remove(animClass);
  }, { once: true });

  renderDetail();
  // 検索モード中なら、移動後のカードのヒット件数を再計算して表示更新
  if (document.querySelector('.header').classList.contains('search-mode')) {
    updateDetailHitCount();
  }
  document.getElementById('mainArea').scrollTop = 0;
}

// --- ナビゲーションインジケーターを更新 ---
function updateNavIndicator() {
  const indicator = document.getElementById('detailNavIndicator');
  const prevArrow = document.getElementById('detailNavPrev');
  const nextArrow = document.getElementById('detailNavNext');
  const navText = document.getElementById('detailNavText');

  if (detailNavList.length <= 1) {
    indicator.classList.remove('show');
    return;
  }

  indicator.classList.add('show');
  navText.textContent = `${detailNavIndex + 1} / ${detailNavList.length}`;

  prevArrow.classList.toggle('disabled', detailNavIndex === 0);
  nextArrow.classList.toggle('disabled', detailNavIndex === detailNavList.length - 1);
}

// --- BlobをオブジェクトURLに変換（表示用） ---
function blobToUrl(blob) {
  if (!blob) return null;
  if (typeof blob === 'string') return blob; // 万一base64文字列が残っていた場合の保険
  return URL.createObjectURL(blob);
}

// --- 詳細画面の画像エリアを描画（◁▷ボタン・ドット含む） ---
function updateDetailImage(p) {
  const imgArea = document.getElementById('detailImage');
  const hasMulti = p.images.length > 1;
  const url = blobToUrl(p.images[currentImageIndex]);

  currentImageCount = p.images.length; // 画像枚数を保持（スワイプ判定で使用）

  const navPrev = hasMulti
    ? `<button class="detail-image-nav prev" onclick="navigateDetailImage(-1)" aria-label="前の画像">
         <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
       </button>`
    : '';
  const navNext = hasMulti
    ? `<button class="detail-image-nav next" onclick="navigateDetailImage(1)" aria-label="次の画像">
         <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
       </button>`
    : '';
  const dotHtml = hasMulti
    ? `<div class="detail-image-dots">
         ${p.images.map((_, i) => `<span class="detail-image-dot${i === currentImageIndex ? ' active' : ''}"></span>`).join('')}
       </div>`
    : '';

  imgArea.innerHTML = `
    <div class="detail-image-wrap">
      ${navPrev}
      <img src="${url}" alt="" onclick="openLightbox(currentImageIndex)" style="cursor:pointer;" onload="URL.revokeObjectURL(this.src)">
      ${navNext}
    </div>
    ${dotHtml}
  `;
}

// --- 詳細画面内で画像をループ切り替え（◁▷ボタン用） ---
async function navigateDetailImage(direction) {
  const p = await dbGet('products', currentProductId);
  if (!p || !p.images || p.images.length <= 1) return;

  const len = p.images.length;
  currentImageIndex = (currentImageIndex + direction + len) % len;
  updateDetailImage(p);
}

// --- 商品詳細画面を描画 ---
async function renderDetail() {
  await loadTags(); // タグ情報を最新にする
  const p = await dbGet('products', currentProductId);
  if (!p) return;
  const rawQuery = document.getElementById('searchInput').value.trim();

  // ヘッダータイトルに商品名を表示（長い場合はCSSで自動省略される）
  document.getElementById('headerTitle').textContent = p.name || '';

  // 別の商品に切り替わったら画像インデックスをリセット
  if (lastRenderedProductId !== currentProductId) {
    currentImageIndex = 0;
    lastRenderedProductId = currentProductId;
  }

  updateNavIndicator();

  // 商品画像の表示
  const imgArea = document.getElementById('detailImage');
  if (p.images?.length > 0) {
    // インデックスが範囲外なら先頭に戻す（安全対策）
    if (currentImageIndex >= p.images.length) currentImageIndex = 0;
    updateDetailImage(p);
  } else {
    currentImageIndex = 0;
    currentImageCount = 0;
    imgArea.innerHTML = `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
  }

  const brand = allBrands.find(b => b.id === p.brandId);
  const priceText = p.price ? `¥${p.price}` : '';

  let html = `<div class="detail-title">${escHL(p.name, rawQuery)}</div>`;
  html += `<div class="detail-brand">${brand ? escHL(brand.name, rawQuery) : ''}</div>`;

  html += `<div class="detail-meta">`;
  if (p.categoryMakeup) html += `<span class="detail-tag">${escHL(p.categoryMakeup, rawQuery)}</span>`;
  if (p.categorySkincare) html += `<span class="detail-tag">${escHL(p.categorySkincare, rawQuery)}</span>`;
  if (p.volume) html += `<span class="detail-tag">${escHL(p.volume, rawQuery)}</span>`;
  if (priceText) html += `<span class="detail-tag">${priceText}</span>`;
  if (p.purchaseDate) html += `<span class="detail-tag">${esc(p.purchaseDate)}</span>`;
  html += `</div>`;

  // --- タグチップ表示（タグが付いている商品のみ） ---
  if (Array.isArray(p.tagIds) && p.tagIds.length > 0) {
    const tagNames = p.tagIds
      .map(id => allTags.find(t => t.id === id))
      .filter(Boolean);
    if (tagNames.length > 0) {
      html += `<div class="detail-tag-chips">`;
      tagNames.forEach(t => {
        html += `<span class="detail-tag-chip">${escHL(t.name, rawQuery)}</span>`;
      });
      html += `</div>`;
    }
  }

  if (p.ingredients) {
    html += `<div class="detail-section">
      <div class="detail-section-label">全成分</div>
      <div class="detail-section-content">${escHL(p.ingredients, rawQuery)}</div>
    </div>`;
  }

  if (p.memo) {
    html += `<div class="detail-section">
      <div class="detail-section-label">メモ</div>
      <div class="detail-section-content memo-content">${escHL(p.memo, rawQuery)}</div>
    </div>`;
  }

  // --- 全情報をコピー ボタン（最下部に配置） ---
  html += `<div style="margin-bottom:16px;">
    <button class="detail-copy-btn" onclick="copyAllInfo()">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      全情報をコピー
    </button>
  </div>`;

  document.getElementById('detailBody').innerHTML = html;
}

// --- 全情報をテキストにまとめてクリップボードにコピー ---
async function copyAllInfo() {
  const p = await dbGet('products', currentProductId);
  if (!p) return;
  const brand = allBrands.find(b => b.id === p.brandId);
  const lines = [];
  if (brand) lines.push(`ブランド：${brand.name}`);
  lines.push(`商品名：${p.name}`);
  if (p.categoryMakeup) lines.push(`カテゴリ（メイク）：${p.categoryMakeup}`);
  if (p.categorySkincare) lines.push(`カテゴリ（スキンケア）：${p.categorySkincare}`);
  if (p.volume) lines.push(`容量：${p.volume}`);
  if (p.price) lines.push(`価格：¥${p.price}`);
  if (p.purchaseDate) lines.push(`購入時期：${p.purchaseDate}`);
  if (Array.isArray(p.tagIds) && p.tagIds.length > 0) {
    const tagNames = p.tagIds
      .map(id => allTags.find(t => t.id === id)?.name)
      .filter(Boolean);
    if (tagNames.length > 0) lines.push(`タグ：${tagNames.join('、')}`);
  }
  if (p.ingredients) lines.push(`\n全成分：\n${p.ingredients}`);
  if (p.memo) lines.push(`\nメモ：\n${p.memo}`);
  doCopy(lines.join('\n'));
}

// --- 個別フィールドのコピー ---
async function copyField(field) {
  const p = await dbGet('products', currentProductId);
  if (!p || !p[field]) return;
  doCopy(p[field]);
}

// --- クリップボードコピー実行（フォールバック付き） ---
function doCopy(text) {
  navigator.clipboard.writeText(text).then(() => {
    toast('コピーしました');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('コピーしました');
  });
}

// --- 編集ボタン → フォーム画面へ ---
function editProduct() {
  openProductForm(currentProductId);
}

// --- 削除確認モーダルを表示 ---
function confirmDeleteProduct() {
  showModal({
    title: '商品を削除',
    content: 'この商品を削除しますか？この操作は取り消せません。',
    actions: [
      { text: 'キャンセル', cls: 'modal-cancel', action: closeModal },
      { text: '削除', cls: 'modal-danger', action: deleteProduct }
    ]
  });
}

// --- 商品をDBから削除 ---
async function deleteProduct() {
  // 削除対象の商品情報を取得してsortOrderから除外
  const product = await dbGet('products', currentProductId);
  if (product?.brandId) {
    const brand = await dbGet('brands', product.brandId);
    if (brand?.sortOrder) {
      brand.sortOrder = brand.sortOrder.filter(id => id !== currentProductId);
      await dbPut('brands', brand);
    }
  }

  // 削除対象の商品が持っていたタグの cardOrder からも除外
  if (Array.isArray(product?.tagIds) && product.tagIds.length > 0) {
    for (const tagId of product.tagIds) {
      const tag = await dbGet('tags', tagId);
      if (tag && Array.isArray(tag.cardOrder)) {
        tag.cardOrder = tag.cardOrder.filter(id => id !== currentProductId);
        await dbPut('tags', tag);
      }
    }
  }

  await dbDelete('products', currentProductId);
  await markDataUpdated();
  closeModal();
  toast('商品を削除しました');
  goBack();
}

// --- タグ選択中のID配列（フォーム内で保持） ---
let selectedTagIds = [];

// --- タグ選択モーダル内の作業用バッファ（モーダル内のチェック状態） ---
let tagPickBuffer = [];

// --- タグチップを描画（選択中タグ） ---
function renderFormTagChips() {
  const container = document.getElementById('formTagChips');
  if (!container) return;
  const xSvg = `<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  let html = '';
  selectedTagIds.forEach(tagId => {
    const tag = allTags.find(t => t.id === tagId);
    if (!tag) return; // 万一存在しないタグはスキップ
    html += `
      <div class="form-tag-chip">
        <span>${esc(tag.name)}</span>
        <button type="button" onclick="removeFormTag('${tag.id}')">${xSvg}</button>
      </div>`;
  });
  container.innerHTML = html;
  updateTagTriggerLabel();
}

// --- タグ選択ボタンのラベルを更新（選択件数表示） ---
function updateTagTriggerLabel() {
  const label = document.getElementById('formTagTriggerLabel');
  if (!label) return;
  if (selectedTagIds.length === 0) {
    label.textContent = 'タグを選択';
    label.style.color = '';
  } else {
    label.textContent = `${selectedTagIds.length}件選択中`;
    label.style.color = 'var(--text)';
  }
}

// --- タグチップの×ボタンで外す ---
function removeFormTag(tagId) {
  selectedTagIds = selectedTagIds.filter(id => id !== tagId);
  renderFormTagChips();
}

// --- タグ選択モーダルを開く ---
function openTagPickModal() {
  // 現在の選択状態をバッファにコピー（キャンセル時はバッファごと破棄）
  tagPickBuffer = [...selectedTagIds];
  showModal({
    title: 'タグを選択',
    content: `<div class="tag-pick-list" id="tagPickList"></div>`,
    actions: [
      { text: 'キャンセル', cls: 'modal-cancel', action: closeModal },
      { text: '完了', cls: 'modal-primary', action: applyTagPick }
    ]
  });
  renderTagPickList();
}

// --- タグ選択モーダル内のリストを描画 ---
function renderTagPickList() {
  const container = document.getElementById('tagPickList');
  if (!container) return;
  if (allTags.length === 0) {
    container.innerHTML = '<div class="tag-pick-empty">タグが登録されていません</div>';
    return;
  }
  const checkSvg = `<svg viewBox="0 0 24 24"><polyline points="5 12 10 17 19 7"/></svg>`;
  let html = '';
  allTags.forEach(t => {
    const checked = tagPickBuffer.includes(t.id);
    html += `
      <button type="button" class="tag-pick-item ${checked ? 'checked' : ''}" onclick="toggleTagPick('${t.id}')">
        <span class="tag-pick-check">${checkSvg}</span>
        <span class="tag-pick-name">${esc(t.name)}</span>
      </button>`;
  });
  container.innerHTML = html;
}

// --- タグ選択モーダル内でタグのチェックをトグル ---
function toggleTagPick(tagId) {
  if (tagPickBuffer.includes(tagId)) {
    tagPickBuffer = tagPickBuffer.filter(id => id !== tagId);
  } else {
    tagPickBuffer.push(tagId);
  }
  renderTagPickList();
}

// --- 「完了」ボタンでバッファを実際の選択状態に反映 ---
function applyTagPick() {
  selectedTagIds = [...tagPickBuffer];
  closeModal();
  renderFormTagChips();
}

// --- 新規タグ追加モーダル（フォーム画面用） ---
function openAddTagModalForForm() {
  showModal({
    title: 'タグを追加',
    content: '<input type="text" class="modal-input" id="newTagFormInput" placeholder="タグ名を入力" maxlength="30" autocomplete="off">',
    actions: [
      { text: 'キャンセル', cls: 'modal-cancel', action: closeModal },
      { text: '追加', cls: 'modal-primary', action: addTagFromForm }
    ]
  });
  setTimeout(() => {
    const input = document.getElementById('newTagFormInput');
    if (input) input.focus();
  }, 100);
}

// --- フォーム内からタグを追加して即選択状態にする ---
async function addTagFromForm() {
  const input = document.getElementById('newTagFormInput');
  const name = input ? input.value.trim() : '';
  if (!name) { toast('タグ名を入力してください'); return; }
  if (allTags.some(t => t.name === name)) {
    toast('同じ名前のタグが既にあります');
    return;
  }
  const maxOrder = allTags.reduce((max, t) => Math.max(max, t.order ?? 0), -1);
  const newTag = {
    id: genId(),
    name,
    order: maxOrder + 1,
    cardOrder: [],
    createdAt: new Date().toISOString()
  };
  await dbPut('tags', newTag);
  await markDataUpdated();
  await loadTags();
  selectedTagIds.push(newTag.id);
  closeModal();
  renderFormTagChips();
  toast(`「${name}」を追加しました`);
}

// --- カテゴリ選択肢を更新（hidden selectのvalue保持＋トリガーラベル更新） ---
function refreshCategorySelects(selectedMakeup, selectedSkincare) {
  const makeupSel = document.getElementById('formCategoryMakeup');
  const skincareSel = document.getElementById('formCategorySkincare');

  // hidden selectには値保持のために最低限のoptionだけ生成
  let makeupHtml = '<option value=""></option>';
  let skincareHtml = '<option value=""></option>';

  allCategories.forEach(c => {
    if (c.group === 'makeup') {
      makeupHtml += `<option value="${esc(c.name)}"></option>`;
    } else if (c.group === 'skincare') {
      skincareHtml += `<option value="${esc(c.name)}"></option>`;
    }
  });

  makeupSel.innerHTML = makeupHtml;
  skincareSel.innerHTML = skincareHtml;

  if (selectedMakeup) makeupSel.value = selectedMakeup;
  if (selectedSkincare) skincareSel.value = selectedSkincare;

  updateCategoryTriggerLabel('makeup');
  updateCategoryTriggerLabel('skincare');
}

// --- カテゴリ追加モーダルを開く（フォーム画面用） ---
function openAddCategoryModal(group) {
  const groupLabel = group === 'skincare' ? 'スキンケア' : 'メイク';
  showModal({
    title: `${groupLabel}カテゴリを追加`,
    content: '<input class="modal-input" id="newCategoryInput" placeholder="例：リップ" autocomplete="off">',
    actions: [
      { text: 'キャンセル', cls: 'modal-cancel', action: closeModal },
      { text: '追加', cls: 'modal-ok', action: () => addCategoryFromForm(group) }
    ]
  });
  setTimeout(() => {
    const input = document.getElementById('newCategoryInput');
    if (input) input.focus();
  }, 100);
}

// --- カテゴリをDBに追加して選択肢を更新（フォーム画面用） ---
async function addCategoryFromForm(group) {
  const input = document.getElementById('newCategoryInput');
  const name = input ? input.value.trim() : '';
  if (!name) { toast('カテゴリ名を入力してください'); return; }

  if (allCategories.some(c => c.name === name)) {
    toast('同じ名前のカテゴリが既にあります');
    return;
  }

  const newCat = { id: genId(), name, group, order: allCategories.length };
  await dbPut('categories', newCat);
  await markDataUpdated();
  await loadCategories();

  const curMakeup = group === 'makeup' ? name : document.getElementById('formCategoryMakeup').value;
  const curSkincare = group === 'skincare' ? name : document.getElementById('formCategorySkincare').value;
  refreshCategorySelects(curMakeup, curSkincare);
  closeModal();
  toast(`「${name}」を追加しました`);
}

// --- カテゴリ選択モーダル用のバッファ（モーダル内の選択状態） ---
let categoryPickGroup = ''; // 'makeup' または 'skincare'
let categoryPickBuffer = '';

// --- カテゴリ選択モーダルを開く ---
function openCategoryPickModal(group) {
  categoryPickGroup = group;
  const sel = document.getElementById(group === 'makeup' ? 'formCategoryMakeup' : 'formCategorySkincare');
  categoryPickBuffer = sel ? (sel.value || '') : '';
  const groupLabel = group === 'skincare' ? 'スキンケア' : 'メイク';
  showModal({
    title: `${groupLabel}カテゴリを選択`,
    content: `<div class="brand-pick-list" id="categoryPickList"></div>`,
    actions: [
      { text: 'キャンセル', cls: 'modal-cancel', action: closeModal },
      { text: '完了', cls: 'modal-primary', action: applyCategoryPick }
    ]
  });
  renderCategoryPickList();
}

// --- カテゴリ選択モーダル内のリストを描画 ---
function renderCategoryPickList() {
  const container = document.getElementById('categoryPickList');
  if (!container) return;
  const groupLabel = categoryPickGroup === 'skincare' ? 'スキンケア' : 'メイク';
  let html = '';

  // 未選択（先頭）
  const noneSelected = categoryPickBuffer === '';
  html += `<button type="button" class="brand-pick-item ${noneSelected ? 'selected' : ''}" onclick="selectCategoryPick('')">
    <span class="brand-pick-radio"></span>
    <span class="brand-pick-name">${groupLabel}（未選択）</span>
  </button>`;

  // 該当グループのカテゴリ一覧
  allCategories
    .filter(c => c.group === categoryPickGroup)
    .forEach(c => {
      const selected = categoryPickBuffer === c.name;
      html += `<button type="button" class="brand-pick-item ${selected ? 'selected' : ''}" onclick="selectCategoryPick('${c.id}')">
        <span class="brand-pick-radio"></span>
        <span class="brand-pick-name">${esc(c.name)}</span>
      </button>`;
    });

  container.innerHTML = html;
}

// --- カテゴリ選択モーダル内で項目をタップ ---
function selectCategoryPick(catId) {
  if (!catId) {
    categoryPickBuffer = '';
  } else {
    const cat = allCategories.find(c => c.id === catId);
    if (cat) categoryPickBuffer = cat.name;
  }
  renderCategoryPickList();
}

// --- 「完了」ボタンでバッファを実際の選択状態に反映 ---
function applyCategoryPick() {
  const sel = document.getElementById(categoryPickGroup === 'makeup' ? 'formCategoryMakeup' : 'formCategorySkincare');
  if (sel) sel.value = categoryPickBuffer;
  closeModal();
  updateCategoryTriggerLabel(categoryPickGroup);
}

// --- カテゴリトリガーボタンのラベルを更新 ---
function updateCategoryTriggerLabel(group) {
  const sel = document.getElementById(group === 'makeup' ? 'formCategoryMakeup' : 'formCategorySkincare');
  const label = document.getElementById(group === 'makeup' ? 'formCategoryMakeupLabel' : 'formCategorySkincareLabel');
  const trigger = document.getElementById(group === 'makeup' ? 'formCategoryMakeupTrigger' : 'formCategorySkincareTrigger');
  if (!sel || !label || !trigger) return;
  const v = sel.value;
  const groupLabel = group === 'skincare' ? 'スキンケア' : 'メイク';
  if (!v) {
    label.textContent = `${groupLabel}（未選択）`;
    trigger.classList.add('placeholder');
  } else {
    label.textContent = v;
    trigger.classList.remove('placeholder');
  }
}

// --- ブランド名のグループキーを判定（'A-Z' または 'あ'〜'わ'、その他） ---
function getBrandGroupKey(name) {
  if (!name) return 'その他';
  const code = name.charCodeAt(0);

  // ASCII印字可能文字（記号・数字・アルファベット）→ A-Z
  if (code >= 0x21 && code <= 0x7E) return 'A-Z';
  // 全角英数字 → A-Z
  if ((code >= 0xFF10 && code <= 0xFF19) ||
      (code >= 0xFF21 && code <= 0xFF3A) ||
      (code >= 0xFF41 && code <= 0xFF5A)) return 'A-Z';

  // ひらがなはカタカナに正規化してから判定
  let kc = code;
  if (code >= 0x3041 && code <= 0x3096) kc = code + 0x60;

  if (kc >= 0x30A1 && kc <= 0x30AA) return 'あ';
  if (kc >= 0x30AB && kc <= 0x30B4) return 'か';
  if (kc >= 0x30B5 && kc <= 0x30BE) return 'さ';
  if (kc >= 0x30BF && kc <= 0x30C9) return 'た';
  if (kc >= 0x30CA && kc <= 0x30CE) return 'な';
  if (kc >= 0x30CF && kc <= 0x30DD) return 'は';
  if (kc >= 0x30DE && kc <= 0x30E2) return 'ま';
  if (kc >= 0x30E3 && kc <= 0x30E8) return 'や';
  if (kc >= 0x30E9 && kc <= 0x30ED) return 'ら';
  if (kc >= 0x30EE && kc <= 0x30F2) return 'わ';

  // 漢字など → その他
  return 'その他';
}

// --- ブランド名のグループ内ソートキー（記号→数字→アルファベット→五十音順） ---
function getBrandSortKey(name) {
  if (!name) return '\uFFFF';
  const code = name.charCodeAt(0);

  // 記号（ASCII印字可能記号）
  if ((code >= 0x21 && code <= 0x2F) ||
      (code >= 0x3A && code <= 0x40) ||
      (code >= 0x5B && code <= 0x60) ||
      (code >= 0x7B && code <= 0x7E)) {
    return '0_' + name.toLowerCase();
  }
  // 数字（半角・全角）
  if ((code >= 0x30 && code <= 0x39) ||
      (code >= 0xFF10 && code <= 0xFF19)) {
    return '1_' + name.toLowerCase();
  }
  // アルファベット（半角・全角）
  if ((code >= 0x41 && code <= 0x5A) || (code >= 0x61 && code <= 0x7A) ||
      (code >= 0xFF21 && code <= 0xFF3A) || (code >= 0xFF41 && code <= 0xFF5A)) {
    return '2_' + name.toLowerCase();
  }

  // ひらがな・カタカナ：カタカナに正規化して比較
  let normalized = '';
  for (const c of name) {
    const cc = c.charCodeAt(0);
    if (cc >= 0x3041 && cc <= 0x3096) {
      normalized += String.fromCharCode(cc + 0x60);
    } else {
      normalized += c;
    }
  }
  return '3_' + normalized;
}

// --- ブランド選択モーダル内のリストを描画 ---
function renderBrandPickList() {
  const container = document.getElementById('brandPickList');
  if (!container) return;

  // ブランドをグループに振り分け
  const grouped = {};
  allBrands.forEach(b => {
    const key = getBrandGroupKey(b.name);
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(b);
  });

  // 各グループ内をソート
  Object.values(grouped).forEach(arr => {
    arr.sort((a, b) => {
      const ka = getBrandSortKey(a.name);
      const kb = getBrandSortKey(b.name);
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
  });

  let html = '';

  // ＋新規ブランドを作成
  html += `<button type="button" class="brand-pick-item brand-pick-action" onclick="onBrandPickNew()">
    <span class="brand-pick-radio"></span>
    <span class="brand-pick-name">＋ 新規ブランドを作成</span>
  </button>`;

  // ブランドなし（未分類）
  const noneSelected = brandPickBuffer === '';
  html += `<button type="button" class="brand-pick-item ${noneSelected ? 'selected' : ''}" onclick="selectBrandPick('')">
    <span class="brand-pick-radio"></span>
    <span class="brand-pick-name">ブランドなし（未分類）</span>
  </button>`;

  // グループ別
  const GROUP_ORDER = ['A-Z', 'あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ', 'その他'];
  GROUP_ORDER.forEach(groupKey => {
    const arr = grouped[groupKey];
    if (!arr || arr.length === 0) return;
    const label = groupKey === 'A-Z' ? 'A〜Z' : groupKey;
    html += `<div class="brand-pick-header">${label}</div>`;
    arr.forEach(b => {
      const selected = brandPickBuffer === b.id;
      html += `<button type="button" class="brand-pick-item ${selected ? 'selected' : ''}" onclick="selectBrandPick('${b.id}')">
        <span class="brand-pick-radio"></span>
        <span class="brand-pick-name">${esc(b.name)}</span>
      </button>`;
    });
  });

  container.innerHTML = html;
}

// --- 画像ファイル選択後の処理（リサイズ・圧縮してBlobに変換） ---
function onImageSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';

  const img = new Image();
  const objectUrl = URL.createObjectURL(file);
  img.onload = () => {
    URL.revokeObjectURL(objectUrl);
    const MAX = 800;
    const w = img.naturalWidth;
    const h = img.naturalHeight;

    // 長辺が800px以下ならリサイズせずそのままBlobに変換
    if (w <= MAX && h <= MAX) {
      formImages.push(file);
      renderFormImageGrid();
      return;
    }

    // 長辺が800px超えならcanvasでリサイズしてJPEG圧縮
    const scale = MAX / Math.max(w, h);
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => {
      formImages.push(blob);
      renderFormImageGrid();
    }, 'image/jpeg', 0.85);
  };
  img.src = objectUrl;
}

// --- 画像を個別に削除 ---
function removeFormImage(e, index) {
  e.stopPropagation();
  formImages.splice(index, 1);
  renderFormImageGrid();
}

// --- 商品フォームの自動保存（戻るボタン時・アプリ終了時） ---
async function autoSaveProduct() {
  const name = document.getElementById('formName').value.trim();
  if (!name) return; // 商品名が空なら保存しない

  const brandId = document.getElementById('formBrand').value || null;
  const priceRaw = document.getElementById('formPrice').value.trim();
  const priceNum = parseInt(priceRaw.replace(/[^0-9]/g, ''), 10) || 0;

  const productId = editingProductId || genId();
  const wasEditing = !!editingProductId;

  // 編集前の商品を取得（タグ変更判定用）
  let oldProduct = null;
  if (wasEditing) {
    oldProduct = await dbGet('products', productId);
  }

  const data = {
    id: productId,
    brandId,
    name,
    categoryMakeup: document.getElementById('formCategoryMakeup').value,
    categorySkincare: document.getElementById('formCategorySkincare').value,
    volume: document.getElementById('formVolume').value.trim(),
    price: priceRaw,
    priceNum,
    purchaseDate: document.getElementById('formPurchaseDate').value,
    ingredients: document.getElementById('formIngredients').value.trim(),
    memo: document.getElementById('formMemo').value.trim(),
    image: formImages[0] || null,
    images: formImages.length > 0 ? [...formImages] : [],
    tagIds: [...selectedTagIds],
    createdAt: wasEditing
      ? oldProduct?.createdAt || new Date().toISOString()
      : new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  await dbPut('products', data);

  // --- タグ cardOrder の同期 ---
  const oldTagIds = Array.isArray(oldProduct?.tagIds) ? oldProduct.tagIds : [];
  const newTagIds = selectedTagIds;
  const addedTagIds = newTagIds.filter(id => !oldTagIds.includes(id));
  const removedTagIds = oldTagIds.filter(id => !newTagIds.includes(id));

  for (const tagId of addedTagIds) {
    const tag = await dbGet('tags', tagId);
    if (tag) {
      tag.cardOrder = Array.isArray(tag.cardOrder) ? tag.cardOrder : [];
      if (!tag.cardOrder.includes(productId)) {
        tag.cardOrder.push(productId);
        await dbPut('tags', tag);
      }
    }
  }
  for (const tagId of removedTagIds) {
    const tag = await dbGet('tags', tagId);
    if (tag && Array.isArray(tag.cardOrder)) {
      tag.cardOrder = tag.cardOrder.filter(id => id !== productId);
      await dbPut('tags', tag);
    }
  }

  await markDataUpdated();
  toast(wasEditing ? '商品を更新しました' : '商品を登録しました');

  // 保存したIDを保持（バックグラウンド復帰後の連続保存で重複作成を防ぐ）
  editingProductId = productId;
}

// --- 商品をDBに保存（新規登録 or 更新） ---
async function submitProduct() {
  const brandId = document.getElementById('formBrand').value || null;
  const name = document.getElementById('formName').value.trim();

  if (!name) { toast('商品名を入力してください'); return; }

  const priceRaw = document.getElementById('formPrice').value.trim();
  const priceNum = parseInt(priceRaw.replace(/[^0-9]/g, ''), 10) || 0;

  const productId = editingProductId || genId();

  // 編集前の商品を取得（ブランド・タグ変更判定用）
  let oldProduct = null;
  if (editingProductId) {
    oldProduct = await dbGet('products', editingProductId);
  }

  const data = {
    id: productId,
    brandId,
    name,
    categoryMakeup: document.getElementById('formCategoryMakeup').value,
    categorySkincare: document.getElementById('formCategorySkincare').value,
    volume: document.getElementById('formVolume').value.trim(),
    price: priceRaw,
    priceNum,
    purchaseDate: document.getElementById('formPurchaseDate').value,
    ingredients: document.getElementById('formIngredients').value.trim(),
    memo: document.getElementById('formMemo').value.trim(),
    image: formImages[0] || null,
    images: formImages.length > 0 ? [...formImages] : [],
    tagIds: [...selectedTagIds],
    createdAt: editingProductId
      ? oldProduct?.createdAt || new Date().toISOString()
      : new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  await dbPut('products', data);

  // --- ブランド sortOrder の同期 ---
  const oldBrandId = oldProduct?.brandId ?? null;
  const brandChanged = oldBrandId !== brandId;

  if (!editingProductId) {
    // 新規登録：新brandにsortOrderがあれば末尾に追加
    if (brandId) {
      const brand = await dbGet('brands', brandId);
      if (brand?.sortOrder) {
        brand.sortOrder.push(productId);
        await dbPut('brands', brand);
      }
    }
  } else if (brandChanged) {
    // 編集でブランド変更：旧brandから除外、新brandに追加
    if (oldBrandId) {
      const oldBrand = await dbGet('brands', oldBrandId);
      if (oldBrand?.sortOrder) {
        oldBrand.sortOrder = oldBrand.sortOrder.filter(id => id !== productId);
        await dbPut('brands', oldBrand);
      }
    }
    if (brandId) {
      const newBrand = await dbGet('brands', brandId);
      if (newBrand?.sortOrder) {
        newBrand.sortOrder.push(productId);
        await dbPut('brands', newBrand);
      }
    }
  }

  // --- タグ cardOrder の同期 ---
  // 新しく付いたタグの cardOrder には末尾に追加、外したタグの cardOrder からは除外
  const oldTagIds = Array.isArray(oldProduct?.tagIds) ? oldProduct.tagIds : [];
  const newTagIds = selectedTagIds;
  const addedTagIds = newTagIds.filter(id => !oldTagIds.includes(id));
  const removedTagIds = oldTagIds.filter(id => !newTagIds.includes(id));

  for (const tagId of addedTagIds) {
    const tag = await dbGet('tags', tagId);
    if (tag) {
      tag.cardOrder = Array.isArray(tag.cardOrder) ? tag.cardOrder : [];
      if (!tag.cardOrder.includes(productId)) {
        tag.cardOrder.push(productId);
        await dbPut('tags', tag);
      }
    }
  }
  for (const tagId of removedTagIds) {
    const tag = await dbGet('tags', tagId);
    if (tag && Array.isArray(tag.cardOrder)) {
      tag.cardOrder = tag.cardOrder.filter(id => id !== productId);
      await dbPut('tags', tag);
    }
  }

  await markDataUpdated();
  toast(editingProductId ? '商品を更新しました' : '商品を登録しました');

  if (editingProductId) {
    currentProductId = editingProductId;
    editingProductId = null;
    screenHistory.pop();
    showScreen('detail', false);
  } else {
    editingProductId = null;
    formSubmitted = true;
    goBack();
  }
}

// --- 成分テキストの自動整形（OCRゴミ除去・区切り統一など） ---
function formatIngredients() {
  const ta = document.getElementById('formIngredients');
  let text = ta.value;
  if (!text.trim()) { toast('成分テキストを入力してください'); return; }

  text = text.replace(/\r?\n/g, '');           // 改行を除去
  text = text.replace(/ +/g, '');              // 半角スペースをすべて削除
  text = text.replace(/[●◆◇■□▲△▼▽★☆※＊]/g, ''); // OCRゴミ記号を除去
  text = text.trim();                          // 前後の空白除去

  // 区切り文字を「、」に統一（スラッシュは除外）
  text = text.replace(/[,，・]/g, '、');
  text = text.replace(/、{2,}/g, '、');         // 重複読点を1つに
  text = text.replace(/\s*、\s*/g, '、');       // 読点前後の空白を除去

  ta.value = text;
  toast('成分テキストを整形しました');
}

// --- メモフォーム初期値（変更検知用） ---
let memoFormOriginalTitle = '';
let memoFormOriginalBody = '';

// --- メモIDからタイトルを取得（ヘッダー表示用） ---
function getMemoTitle(id) {
  const m = allMemos.find(mm => mm.id === id);
  return (m && m.title) ? m.title : 'メモ詳細';
}

// --- 検索・ソート済みのメモ一覧を取得（一覧描画とスワイプ遷移で共用） ---
function getFilteredSortedMemos() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  let memos = allMemos;

  // 検索フィルタ（AND検索）
  if (query) {
    const queries = splitQuery(query);
    memos = memos.filter(m => {
      const text = [m.title, m.body].join(' ').toLowerCase();
      return matchesAllQueries(text, queries);
    });
  }

  // ソート適用
  const [sortField, sortOrder] = currentMemoSort.split('_');
  const dir = sortOrder === 'asc' ? 1 : -1;
  memos = memos.slice().sort((a, b) => {
    if (sortField === 'name') {
      const va = a.title || '';
      const vb = b.title || '';
      return va.localeCompare(vb, 'ja') * dir;
    }
    const va = a.updatedAt || a.createdAt || '';
    const vb = b.updatedAt || b.createdAt || '';
    return va.localeCompare(vb, 'ja') * dir;
  });

  return memos;
}

  document.getElementById('headerTotalCount').textContent = allMemos.length + '件';

  const rawQuery = document.getElementById('searchInput').value.trim();

// --- メモ詳細画面でのスワイプで前後のメモに遷移 ---
{
  let memoSwipeStartX = 0;
  let memoSwipeStartY = 0;
  let memoSwipeStartTime = 0;
  const mainArea = document.getElementById('mainArea');

  mainArea.addEventListener('touchstart', (e) => {
    if (currentScreen !== 'memoDetail') return;
    if (e.touches.length !== 1) return;
    memoSwipeStartX = e.touches[0].clientX;
    memoSwipeStartY = e.touches[0].clientY;
    memoSwipeStartTime = Date.now();
  }, { passive: true });

  mainArea.addEventListener('touchend', (e) => {
    if (currentScreen !== 'memoDetail') return;

    const dx = e.changedTouches[0].clientX - memoSwipeStartX;
    const dy = e.changedTouches[0].clientY - memoSwipeStartY;
    const dt = Date.now() - memoSwipeStartTime;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    // 横方向に十分な距離・速度で、かつ縦方向より大きいスワイプ
    if (absDx > 70 && absDx > absDy * 1.5 && dt < 400) {
      const memos = getFilteredSortedMemos();
      const idx = memos.findIndex(m => m.id === currentMemoId);
      if (idx === -1) return;

      // 検索モード中かどうかを判定（移動後にヒット件数を更新するため）
      const isSearchMode = document.querySelector('.header').classList.contains('search-mode');

      if (dx < 0) {
        // 左スワイプ → 次のメモ（リスト下方向）
        if (idx < memos.length - 1) {
          const next = memos[idx + 1];
          currentMemoId = next.id;
          // タイトルを即座に更新（描画遅延によるチラつき防止）
          document.getElementById('headerTitle').textContent = next.title || 'メモ詳細';
          renderMemoDetail();
          // 検索モード中なら、移動後のメモのヒット件数を再計算して表示更新
          if (isSearchMode) updateDetailHitCount();
          document.getElementById('mainArea').scrollTop = 0;
        } else {
          toast('最後のメモです');
        }
      } else {
        // 右スワイプ → 前のメモ（リスト上方向）
        if (idx > 0) {
          const prev = memos[idx - 1];
          currentMemoId = prev.id;
          document.getElementById('headerTitle').textContent = prev.title || 'メモ詳細';
          renderMemoDetail();
          // 検索モード中なら、移動後のメモのヒット件数を再計算して表示更新
          if (isSearchMode) updateDetailHitCount();
          document.getElementById('mainArea').scrollTop = 0;
        } else {
          toast('最初のメモです');
        }
      }
    }
  }, { passive: true });
}

   ══════════════════════════════════════════ */

// --- ヒット数カウント用ヘルパー：テキスト内のクエリ出現回数 ---
function countHits(text, query) {
  if (!query || !text) return 0;
  const lowerText = String(text).toLowerCase();
  const lowerQuery = String(query).toLowerCase();
  if (lowerQuery.length === 0) return 0;
  let count = 0;
  let pos = 0;
  while ((pos = lowerText.indexOf(lowerQuery, pos)) !== -1) {
    count++;
    pos += lowerQuery.length;
  }
  return count;
}

// --- クエリをスペース(半角・全角)で分割し、空要素を除いた配列を返す ---
function splitQuery(rawQuery) {
  if (!rawQuery) return [];
  return String(rawQuery).split(/[\s　]+/).filter(Boolean);
}

// --- text内に queries の全単語が含まれるか(AND検索, 大文字小文字無視) ---
function matchesAllQueries(text, queries) {
  if (!queries || queries.length === 0) return true;
  const lowerText = String(text || '').toLowerCase();
  return queries.every(q => lowerText.includes(String(q).toLowerCase()));
}

// --- 1つの商品データ内のヒット箇所数を計算（全フィールド合計、ブランド名も対象、複数単語対応） ---
function countProductHits(product, query) {
  if (!product) return 0;
  const queries = splitQuery(query);
  if (queries.length === 0) return 0;

  const brand = allBrands.find(b => b.id === product.brandId);
  const brandName = brand ? brand.name : '';

  const fields = [
    product.name,
    brandName,
    product.categoryMakeup,
    product.categorySkincare,
    product.ingredients,
    product.memo,
    product.volume,
    product.price
  ];

  // 各単語のヒット数をフィールド全体で合計
  return queries.reduce((total, q) => {
    return total + fields.reduce((sum, f) => sum + countHits(f, q), 0);
  }, 0);
}

// --- 1つのメモデータ内のヒット箇所数を計算（タイトル＋本文、複数単語対応） ---
function countMemoHits(memo, query) {
  if (!memo) return 0;
  const queries = splitQuery(query);
  if (queries.length === 0) return 0;
  return queries.reduce((total, q) => {
    return total + countHits(memo.title, q) + countHits(memo.body, q);
  }, 0);
}

// --- ステータスバー（PWAテーマカラー）の色を切り替え ---
// mode: 'normal' = 通常時のブルー、'search' = 検索モード時のピンク
function updateThemeColor(mode) {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (!meta) return;
  if (mode === 'search') {
    meta.setAttribute('content', '#D6A3C8');  // --accent と同じ色
  } else {
    meta.setAttribute('content', '#8ea2cc');  // --primary と同じ色
  }
}

// --- 検索バーの背景色を、入力有無と画面に応じて切り替え ---

  const searchWrap = document.querySelector('.search-wrap');
  if (!searchWrap) return;
  const query = document.getElementById('searchInput').value;
  // いったん両方のクラスを外す
  searchWrap.classList.remove('is-list-search', 'is-detail-search');
  // 入力が空なら色なし

  }
}

// --- 詳細画面用：現在の対象データのヒット数を検索バー内に表示 ---
function updateDetailHitCount() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) {
    document.getElementById('searchTotalCount').textContent = '';
    return;
  }
  let count = 0;
  if (currentScreen === 'detail') {
    const product = allProducts.find(p => p.id === currentProductId);
    if (product) count = countProductHits(product, query);
  } else if (currentScreen === 'memoDetail') {
    const memo = allMemos.find(m => m.id === currentMemoId);
    if (memo) count = countMemoHits(memo, query);
  }
  document.getElementById('searchTotalCount').textContent = count + '件';
}

function toggleSearchMode() {

    closeSearchMode();
  } else {
    openSearchMode();
  }
}

// --- 検索モードを開く（ヘッダー全体をピンクのナビバーに、検索バー表示） ---
// pushHistory: 履歴に追加するか（trueなら新規、falseなら復元）
function openSearchMode(pushHistory = true) {
  const header = document.querySelector('.header');
  if (header.classList.contains('search-mode')) return;

  // ヘッダーを検索ナビバーに切り替え（1段目・2段目両方をピンクに）
  header.classList.add('search-mode');
  document.querySelector('.title-bar').classList.add('search-mode');

  // ステータスバー色をピンクに切り替え
  updateThemeColor('search');

  // 検索バー表示
  document.getElementById('searchBar').classList.add('active');

  // 通常モード要素を非表示（検索モード中は1段目左の検索ボタンを隠す）
  document.getElementById('btnSearch').style.display = 'none';
  document.getElementById('headerTotalCount').style.display = 'none';

  // 検索モード要素を表示
  document.getElementById('searchTotalCount').style.display = 'block';

  // トップ画面（brand/memo）でも検索モード中はヘッダー2段目の＜を表示する
  // （通常時は戻る先がないので非表示だが、検索モード解除のルートとして必要）
  if (currentScreen === 'brand' || currentScreen === 'memo') {
    document.getElementById('btnBack').style.display = 'flex';
  }

  if (pushHistory) {
    // 検索開始画面の記録：クエリが空（新規検索）の場合のみ更新する
    const currentQuery = document.getElementById('searchInput').value.trim();
    if (currentQuery === '') {
      searchOpenedAtDetail = (currentScreen === 'detail' || currentScreen === 'memoDetail');
    }

    // 件数初期化、履歴push、フォーカス
    document.getElementById('searchTotalCount').textContent = '';
    history.pushState({ screen: currentScreen, search: true }, '');
    setTimeout(() => {
      document.getElementById('searchInput').focus();
    }, 50);
  } else {
    // 復元の場合：詳細画面なら件数を再計算（一覧画面はrender関数側で更新される）
    if (currentScreen === 'detail' || currentScreen === 'memoDetail') {
      updateDetailHitCount();
    }
  }

  // 検索バー背景色を更新（クエリが残っていれば画面に応じた色を付与）
  updateSearchBarColor();
}

// --- 検索モードを閉じる ---
function closeSearchMode() {
  const header = document.querySelector('.header');
  if (!header.classList.contains('search-mode')) return;

  // ヘッダーを通常モードに戻す（1段目・2段目両方）
  header.classList.remove('search-mode');
  document.querySelector('.title-bar').classList.remove('search-mode');

  // ステータスバー色をブルーに戻す
  updateThemeColor('normal');

  // 検索バー非表示＆クリア
  document.getElementById('searchBar').classList.remove('active');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');

  // 検索モード要素を非表示
  document.getElementById('searchTotalCount').style.display = 'none';

  // 通常モード要素を画面に応じて再表示
  if (currentScreen === 'brand' || currentScreen === 'memo') {
    document.getElementById('btnSearch').style.display = 'flex';
    document.getElementById('headerTotalCount').style.display = 'block';
    // トップ画面では2段目の＜を非表示に戻す
    document.getElementById('btnBack').style.display = 'none';
  } else if (currentScreen === 'products' || currentScreen === 'tagProducts') {
    // 商品一覧画面では中央の件数バッジは使わない（タイトルに件数を含めるため）
    document.getElementById('btnSearch').style.display = 'flex';
  } else if (currentScreen === 'detail' || currentScreen === 'memoDetail') {
    document.getElementById('btnSearch').style.display = 'flex';
  }

  // 検索開始画面フラグをリセット
  searchOpenedAtDetail = false;

  // 検索バー背景色を解除（クエリがクリアされたので無色に戻る）
  updateSearchBarColor();

  // 検索結果を解除して再描画（ハイライトをクリア）
  if (currentTab === 'card') {
    if (currentScreen === 'brand') renderBrands();
    else if (currentScreen === 'products') renderProducts();
    else if (currentScreen === 'tagProducts') renderTagProducts();
    else if (currentScreen === 'detail') renderDetail();
  } else {
    if (currentScreen === 'memo') renderMemos();
    else if (currentScreen === 'memoDetail') renderMemoDetail();
  }
}

// --- 検索入力時の処理（現在の画面に応じて再描画） ---
function onSearch() {
  const q = document.getElementById('searchInput').value;
  document.getElementById('searchClear').classList.toggle('show', q.length > 0);

  if (currentTab === 'card') {
    if (currentScreen === 'brand') renderBrands();
    else if (currentScreen === 'products') renderProducts();
    else if (currentScreen === 'tagProducts') renderTagProducts();
    else if (currentScreen === 'detail') {
      renderDetail();
      updateDetailHitCount();

  } else {
    if (currentScreen === 'memo') renderMemos();
    else if (currentScreen === 'memoDetail') {
      renderMemoDetail();
      updateDetailHitCount();
    }
  }

  // 検索バー背景色を更新（入力有無と画面に応じて）
  updateSearchBarColor();
}

// --- 検索欄をクリア ---
function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  document.getElementById('searchTotalCount').textContent = '';
  onSearch();
}

// --- BlobをBase64文字列に変換するユーティリティ ---
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    if (!blob) { resolve(null); return; }
    if (typeof blob === 'string') { resolve(blob); return; } // すでにbase64の場合はそのまま
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

// --- Base64文字列をBlobに変換するユーティリティ ---
function base64ToBlob(base64) {
  if (!base64) return null;
  if (base64 instanceof Blob) return base64; // すでにBlobの場合はそのまま
  const [header, data] = base64.split(',');
  const mime = header.match(/:(.*?);/)?.[1] || 'image/jpeg';
  const binary = atob(data);
  const array = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    array[i] = binary.charCodeAt(i);
  }
  return new Blob([array], { type: mime });
}

  await loadCategories();

  if (typeof JSZip === 'undefined') {
    toast('ZIPライブラリの読み込みに失敗しています');
    return;
  }

  const totalProducts = allProducts.length;
  const totalParts = Math.max(1, Math.ceil(totalProducts / PRODUCTS_PER_CHUNK));

  const exportedAt = new Date().toISOString();
  const backupId = `${exportedAt}_${Math.random().toString(36).slice(2, 10)}`;
  const dateStr = exportedAt.slice(0, 10).replace(/-/g, '');

  // フォルダ並び順
  const folderOrderMeta = await dbGet('meta', 'folderOrder');
  const folderOrderForExport = Array.isArray(folderOrderMeta?.value) ? folderOrderMeta.value : [];

  const zip = new JSZip();

  for (let i = 0; i < totalParts; i++) {
    const start = i * PRODUCTS_PER_CHUNK;
    const end = start + PRODUCTS_PER_CHUNK;
    const productsSlice = allProducts.slice(start, end);

    // このチャンク分の画像のみBase64に変換(メモリ効率のため逐次処理)
    const productsChunk = await Promise.all(productsSlice.map(async (p) => {
      const exported = { ...p };
      if (p.images?.length > 0) {
        exported.images = await Promise.all(p.images.map(img => blobToBase64(img)));
        exported.image = exported.images[0] || null;
      }
      return exported;
    }));

    const data = {
      version: 4,
      backupId,
      part: i + 1,
      totalParts,
      exportedAt,
      products: productsChunk
    };

    if (i === 0) {
      data.brands = allBrands;
      data.memos = allMemos;
      data.categories = allCategories;
      data.tags = allTags;
      data.folderOrder = folderOrderForExport;
    }

    const json = JSON.stringify(data, null, 2);
    const partLabel = totalParts > 1 ? `_${i + 1}of${totalParts}` : '';
    const fileName = `pegcosme_backup_${dateStr}${partLabel}.json`;
    zip.file(fileName, json);
  }

  // ZIP生成(DEFLATE圧縮)
  const zipBlob = await zip.generateAsync({
    type: 'blob',
    compression: 'DEFLATE',
    compressionOptions: { level: 6 }
  });

  const url = URL.createObjectURL(zipBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pegcosme_backup_${dateStr}.zip`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  await dbPut('meta', { key: 'lastBackup', value: exportedAt });
  toast(totalParts > 1
    ? `バックアップを保存しました（${totalParts}個のJSONをZIPに格納）`
    : 'バックアップを保存しました');
  checkBackupReminder();
}

// --- インポートファイル選択後の確認 ---
function onImportSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';

  setTimeout(() => {
    if (confirm('現在のデータはすべて上書きされます。復元しますか？')) {
      doImport(file);
    }
  }, 300);
}

// --- インポート実行(ZIP/JSON両対応、逐次処理でメモリ効率化) ---
async function doImport(file) {
  try {
    if (!db) await openDB();
    if (!db) { toast('DB接続に失敗しました'); return; }

    const isZip = file.name.toLowerCase().endsWith('.zip');
    const skincareKW = ['化粧水','乳液','美容液','セラム','クリーム','クレンジング','洗顔','パック','マスク','トナー','エッセンス','ローション','オイル'];

    // インポート中の状態を保持
    const importedCats = [];
    const importedTagIds = new Set();

    // 商品1件をDBに書き込むヘルパー(画像Blob変換とフォーマット移行を含む)
    const importProduct = async (p) => {
      if (p.category !== undefined && p.categoryMakeup === undefined && p.categorySkincare === undefined) {
        const cat = importedCats.find(c => c.name === p.category);
        if (cat && cat.group === 'skincare') {
          p.categorySkincare = p.category;
          p.categoryMakeup = '';
        } else {
          p.categoryMakeup = p.category || '';
          p.categorySkincare = '';
        }
        delete p.category;
      }
      if (p.images === undefined) {
        p.images = p.image ? [p.image] : [];
      }
      if (!p.image && p.images.length > 0) {
        p.image = p.images[0];
      }
      p.images = p.images.map(img => base64ToBlob(img)).filter(Boolean);
      p.image = p.images[0] || null;
      if (!Array.isArray(p.tagIds)) {
        p.tagIds = [];
      } else {
        p.tagIds = p.tagIds.filter(id => importedTagIds.has(id));
      }
      await dbPut('products', p);
    };

    // 第1パートの処理(DBクリア＋メタデータ書き込み＋商品書き込み)
    const importFirstPart = async (ds) => {
      if (!ds.brands || !ds.products) {
        throw new Error('無効なバックアップファイルです');
      }

      await dbClear('brands');
      await dbClear('products');
      await dbClear('memos');
      await dbClear('categories');
      await dbClear('tags');

      for (const b of ds.brands) await dbPut('brands', b);

      if (ds.categories) {
        for (const c of ds.categories) {
          if (!c.group) {
            c.group = skincareKW.some(kw => c.name.includes(kw)) ? 'skincare' : 'makeup';
          }
          await dbPut('categories', c);
          importedCats.push(c);
        }
      }

      if (Array.isArray(ds.tags)) {
        for (const t of ds.tags) {
          await dbPut('tags', t);
          importedTagIds.add(t.id);
        }
      }

      if (ds.memos) {
        for (const m of ds.memos) await dbPut('memos', m);
      }

      if (Array.isArray(ds.folderOrder)) {
        await dbPut('meta', { key: 'folderOrder', value: ds.folderOrder });
      }

      if (Array.isArray(ds.products)) {
        for (const p of ds.products) {
          await importProduct(p);
        }
      }
    };

    if (isZip) {
      // ZIP形式: エントリを1個ずつ逐次処理
      if (typeof JSZip === 'undefined') {
        toast('ZIPライブラリの読み込みに失敗しています');
        return;
      }

      const zip = await JSZip.loadAsync(file);
      const jsonEntries = Object.entries(zip.files)
        .filter(([name, obj]) => !obj.dir && name.toLowerCase().endsWith('.json'));

      if (jsonEntries.length === 0) {
        toast('ZIP内にJSONファイルが見つかりません');
        return;
      }

      // ファイル名のpart番号でソート
      jsonEntries.sort((a, b) => {
        const getPartFromName = (name) => {
          const m = name.match(/_(\d+)of\d+\.json$/i);
          return m ? parseInt(m[1], 10) : 1;
        };
        return getPartFromName(a[0]) - getPartFromName(b[0]);
      });

      let expectedBackupId = null;
      let expectedTotalParts = null;

      // 1エントリずつ取り出してその場で処理(逐次)
      for (let i = 0; i < jsonEntries.length; i++) {
        const [name, fileObj] = jsonEntries[i];
        const text = await fileObj.async('text');
        const ds = JSON.parse(text);

        if (i === 0) {
          // 第1パート: 整合性チェック＆メタデータ書き込み＆第1パートの商品書き込み
          expectedBackupId = ds.backupId !== undefined ? ds.backupId : null;
          expectedTotalParts = ds.totalParts !== undefined ? ds.totalParts : 1;

          if (jsonEntries.length !== expectedTotalParts) {
            toast(`ファイル数が一致しません（${jsonEntries.length}/${expectedTotalParts}）`);
            return;
          }

          if (ds.part !== undefined && ds.part !== 1) {
            toast('第1パートが見つかりません');
            return;
          }

          await importFirstPart(ds);
        } else {
          // 第2パート以降: 整合性チェック＆商品書き込み
          if (ds.backupId !== expectedBackupId) {
            toast('バックアップ群の不一致が検出されました');
            return;
          }
          if (ds.totalParts !== expectedTotalParts) {
            toast('分割数が一致しません');
            return;
          }
          if (ds.part !== i + 1) {
            toast(`パート番号が想定と異なります（期待:${i + 1}, 実際:${ds.part}）`);
            return;
          }

          if (Array.isArray(ds.products)) {
            for (const p of ds.products) {
              await importProduct(p);
            }
          }
        }

        // 周回終わりでtext/dsは次の周回で上書きされ、GC対象になる
      }

    } else {
      // 単一JSONファイル(後方互換、または小規模バックアップ)
      const text = await file.text();
      const ds = JSON.parse(text);
      await importFirstPart(ds);
    }

    // 共通の終了処理
    await loadCategories();
    await markDataUpdated();
    await dbPut('meta', { key: 'lastBackup', value: new Date().toISOString() });
    await dbPut('meta', { key: 'migratedToGroupedCats', value: true });
    await dbPut('meta', { key: 'migratedToImagesArray', value: true });

    toast('データを復元しました');
    screenHistory = [];
    switchTab('card');
  } catch (err) {
    toast('復元に失敗：' + (err.message || err));
    console.error(err);
  }
}

// --- カテゴリ一覧の読み込み ---
async function loadCategories() {
  allCategories = await dbGetAll('categories');
  allCategories.sort((a, b) => (a.order ?? 9999) - (b.order ?? 9999));
}

// --- カテゴリ1行分のHTMLを生成(内部用) ---
function renderCatItem(cat, count, isFirst, isLast) {
  return `
    <div class="cat-item">
      <div class="cat-item-name">${esc(cat.name)}</div>
      <div class="cat-item-count">${count}件</div>
      <button class="cat-item-order-btn${isFirst ? ' disabled' : ''}" onclick="moveCategoryUp('${cat.id}')" title="上へ">▲</button>
      <button class="cat-item-order-btn${isLast ? ' disabled' : ''}" onclick="moveCategoryDown('${cat.id}')" title="下へ">▼</button>
      <button class="cat-item-btn" onclick="showEditCategoryModal('${cat.id}')" title="編集">
        <svg viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
      </button>
      <button class="cat-item-btn delete" onclick="showDeleteCategoryModal('${cat.id}')" title="削除">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
      </button>
    </div>`;
}

// --- カテゴリ一覧の描画(設定画面内、グループ別表示) ---
async function renderCategoryList() {
  await loadCategories();
  await loadAllData();
  const container = document.getElementById('catList');

  const makeupCats = allCategories.filter(c => c.group === 'makeup');
  const skincareCats = allCategories.filter(c => c.group === 'skincare');

  let html = '';

  html += '<div class="cat-group-header">メイク</div>';
  if (makeupCats.length === 0) {
    html += '<div style="font-size:13px;color:var(--text-lighter);padding:4px 0 8px;">カテゴリなし</div>';
  } else {
    for (let i = 0; i < makeupCats.length; i++) {
      const cat = makeupCats[i];
      const count = allProducts.filter(p => p.categoryMakeup === cat.name).length;
      html += renderCatItem(cat, count, i === 0, i === makeupCats.length - 1);
    }
  }
  html += '<button class="cat-add-group-btn" onclick="showAddCategoryModalInSettings(\'makeup\')">＋ メイクカテゴリを追加</button>';

  html += '<div class="cat-group-header" style="margin-top:16px;">スキンケア</div>';
  if (skincareCats.length === 0) {
    html += '<div style="font-size:13px;color:var(--text-lighter);padding:4px 0 8px;">カテゴリなし</div>';
  } else {
    for (let i = 0; i < skincareCats.length; i++) {
      const cat = skincareCats[i];
      const count = allProducts.filter(p => p.categorySkincare === cat.name).length;
      html += renderCatItem(cat, count, i === 0, i === skincareCats.length - 1);
    }
  }
  html += '<button class="cat-add-group-btn" onclick="showAddCategoryModalInSettings(\'skincare\')">＋ スキンケアカテゴリを追加</button>';

  container.innerHTML = html;
}

// --- カテゴリ追加モーダル(設定画面用) ---
function showAddCategoryModalInSettings(group) {
  const groupLabel = group === 'skincare' ? 'スキンケア' : 'メイク';
  showModal({
    title: `${groupLabel}カテゴリを追加`,
    content: '<input type="text" class="modal-input" id="catInput" placeholder="カテゴリ名を入力" maxlength="30">',
    actions: [
      { text: 'キャンセル', cls: 'modal-cancel', action: closeModal },
      { text: '追加', cls: 'modal-primary', action: () => addCategory(group) }
    ]
  });
  setTimeout(() => {
    const input = document.getElementById('catInput');
    if (input) input.focus();
  }, 100);
}

// --- カテゴリ追加の実行(設定画面用) ---
async function addCategory(group) {
  const input = document.getElementById('catInput');
  const name = input?.value.trim();
  if (!name) {
    toast('カテゴリ名を入力してください');
    return;
  }
  if (allCategories.some(c => c.name === name)) {
    toast('同じ名前のカテゴリが既にあります');
    return;
  }
  const maxOrder = allCategories.reduce((max, c) => Math.max(max, c.order ?? 0), -1);
  await dbPut('categories', { id: genId(), name, group, order: maxOrder + 1 });
  await markDataUpdated();
  closeModal();
  toast('カテゴリを追加しました');
  renderCategoryList();
}

// --- カテゴリ編集モーダル ---
function showEditCategoryModal(catId) {
  const cat = allCategories.find(c => c.id === catId);
  if (!cat) return;
  showModal({
    title: 'カテゴリを編集',
    content: `<input type="text" class="modal-input" id="catInput" value="${esc(cat.name)}" maxlength="30">`,
    actions: [
      { text: 'キャンセル', cls: 'modal-cancel', action: closeModal },
      { text: '保存', cls: 'modal-primary', action: () => updateCategory(catId) }
    ]
  });
  setTimeout(() => {
    const input = document.getElementById('catInput');
    if (input) { input.focus(); input.select(); }
  }, 100);
}

// --- カテゴリ編集の実行 ---
async function updateCategory(catId) {
  const input = document.getElementById('catInput');
  const newName = input?.value.trim();
  if (!newName) {
    toast('カテゴリ名を入力してください');
    return;
  }
  const cat = allCategories.find(c => c.id === catId);
  if (!cat) return;
  if (allCategories.some(c => c.id !== catId && c.name === newName)) {
    toast('同じ名前のカテゴリが既にあります');
    return;
  }
  const oldName = cat.name;
  cat.name = newName;
  await dbPut('categories', cat);
  if (oldName !== newName) {
    await loadAllData();
    const field = cat.group === 'skincare' ? 'categorySkincare' : 'categoryMakeup';
    for (const p of allProducts) {
      if (p[field] === oldName) {
        p[field] = newName;
        await dbPut('products', p);
      }
    }
  }
  await markDataUpdated();
  closeModal();
  toast('カテゴリを更新しました');
  renderCategoryList();
}

// --- カテゴリ削除モーダル ---
function showDeleteCategoryModal(catId) {
  const cat = allCategories.find(c => c.id === catId);
  if (!cat) return;
  const field = cat.group === 'skincare' ? 'categorySkincare' : 'categoryMakeup';
  const count = allProducts.filter(p => p[field] === cat.name).length;
  let msg = `「${esc(cat.name)}」を削除しますか？`;
  if (count > 0) {
    msg += `<br><br><span style="color:var(--accent);font-size:13px;">この操作により、このカテゴリを使用中の ${count} 件の商品が「未分類」に変更されます。</span>`;
  }
  showModal({
    title: 'カテゴリを削除',
    content: msg,
    actions: [
      { text: 'キャンセル', cls: 'modal-cancel', action: closeModal },
      { text: '削除する', cls: 'modal-danger', action: () => deleteCategory(catId) }
    ]
  });
}

// --- カテゴリ削除の実行 ---
async function deleteCategory(catId) {
  const cat = allCategories.find(c => c.id === catId);
  if (!cat) return;
  await loadAllData();
  const field = cat.group === 'skincare' ? 'categorySkincare' : 'categoryMakeup';
  for (const p of allProducts) {
    if (p[field] === cat.name) {
      p[field] = '';
      await dbPut('products', p);
    }
  }
  await dbDelete('categories', catId);
  await markDataUpdated();
  closeModal();
  toast('カテゴリを削除しました');
  renderCategoryList();
}

// --- カテゴリを1つ上に移動 ---
async function moveCategoryUp(catId) {
  await loadCategories();
  const cat = allCategories.find(c => c.id === catId);
  if (!cat) return;
  const group = allCategories.filter(c => c.group === cat.group);
  const idx = group.findIndex(c => c.id === catId);
  if (idx <= 0) return;
  [group[idx], group[idx - 1]] = [group[idx - 1], group[idx]];
  for (let i = 0; i < group.length; i++) {
    group[i].order = i;
    await dbPut('categories', group[i]);
  }
  await markDataUpdated();
  renderCategoryList();
}

// --- カテゴリを1つ下に移動 ---
async function moveCategoryDown(catId) {
  await loadCategories();
  const cat = allCategories.find(c => c.id === catId);
  if (!cat) return;
  const group = allCategories.filter(c => c.group === cat.group);
  const idx = group.findIndex(c => c.id === catId);
  if (idx < 0 || idx >= group.length - 1) return;
  [group[idx], group[idx + 1]] = [group[idx + 1], group[idx]];
  for (let i = 0; i < group.length; i++) {
    group[i].order = i;
    await dbPut('categories', group[i]);
  }
  await markDataUpdated();
  renderCategoryList();
}
